<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Excel実務トレーニング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Manrope:wght@600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: 実務の作業指示書。落ち着いて、迷わせない。
   IDEA: 依頼票に蛍光マーカーを引いてから手を動かす、業務のデスク。
   PICTURE: ミッションボード（依頼票の束）と、マーカーを引ける依頼文そのもの。
   COLOUR and TYPE: 白地・墨色・蛍光イエローの一点。BIZ UDPゴシック＋数字はManrope。
   LAYOUT: 上部ナビ、本文1240px、ミッションは段階の列、作業画面はステップを上に並べた1カラム。 */
:root{color-scheme:light dark;
 --bg:light-dark(#ffffff,#101418);--ink:light-dark(#101418,#eef1f4);--sub:light-dark(#5b6573,#a5afbb);
 --line:light-dark(#e2e5e9,#2a333d);--panel:light-dark(#f5f6f8,#182029);--card:light-dark(#ffffff,#141b22);
 --mk:#ffd84a;--mkink:#101418;--bad:light-dark(#b42318,#ff8a7a);--badbg:light-dark(#fdecea,#3a1d1a);
 --okbg:light-dark(#fff6cc,#3a3210)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;overflow-x:clip}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
.num{font-family:Manrope,"BIZ UDPGothic",sans-serif;font-weight:800;font-variant-numeric:tabular-nums}
.wrap{max-width:1240px;margin:0 auto;padding:0 max(4vw,16px)}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:16px;min-height:60px;flex-wrap:wrap;padding-block:6px}
.brand{font-weight:700;font-size:17px;text-decoration:none;display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand i{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:6px;background:var(--ink);color:var(--bg);font-style:normal;font-family:Manrope;font-weight:800;font-size:15px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
nav.tabs a{flex:none;text-decoration:none;padding:9px 12px;border-radius:8px;font-size:15px;color:var(--sub);white-space:nowrap}
nav.tabs a[aria-current=page]{color:var(--ink);background:var(--panel);font-weight:700}
.sync{font-size:13px;color:var(--sub);white-space:nowrap}
main{padding-bottom:80px}
h1{font-size:clamp(28px,4vw,42px);line-height:1.15;margin:0 0 12px;text-wrap:balance}
h2{font-size:24px;line-height:1.3;margin:0 0 10px}
h3{font-size:18px;margin:0 0 6px}
p{margin:0 0 12px}
.sub{color:var(--sub)}
.small{font-size:14px}
.band{padding:clamp(24px,4vw,52px) 0}
.mk{background:linear-gradient(transparent 55%,var(--mk) 55%);color:inherit}
/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:clamp(20px,4vw,48px);align-items:end}
.facts{display:grid;gap:10px}
.fact{display:flex;gap:12px;align-items:baseline;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.fact b{flex:none;font-size:13px;color:var(--sub);font-weight:400;width:6.5em}
.meter{display:flex;gap:4px;margin:14px 0 6px}
.meter span{flex:1;height:10px;border-radius:3px;background:var(--line)}
.meter span.p{background:light-dark(#c9ced5,#4a5561)}.meter span.d{background:var(--mk)}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-top:8px}
.stage h3{font-size:16px;display:flex;gap:8px;align-items:baseline}
.stage h3 .num{font-size:22px}
.stage>p{font-size:14px;color:var(--sub);min-height:3em}
.ticket{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px 12px;margin-bottom:12px;position:relative;transition:transform .15s,box-shadow .15s}
.ticket:hover{transform:translateY(-2px);box-shadow:0 6px 18px light-dark(rgba(16,20,24,.08),rgba(0,0,0,.4))}
.ticket:focus-visible{outline:3px solid var(--mk);outline-offset:2px}
.tk-h{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub)}
.tk-t{font-weight:700;font-size:17px;line-height:1.4;margin:6px 0 4px}
.tk-f{font-size:13px;color:var(--sub)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.chip.d{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.d::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mk)}
.chip.p{background:var(--panel)}
.stars{letter-spacing:1px;color:var(--ink)}
/* mission */
.mhead{display:grid;gap:6px;padding:22px 0 14px}
.back{font-size:14px;color:var(--sub);text-decoration:none}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--sub)}
.steps{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;border-bottom:1px solid var(--line);margin-bottom:22px;scrollbar-width:thin}
.steps button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;font-size:14px;cursor:pointer;min-height:40px;display:flex;gap:6px;align-items:center}
.steps button[aria-current=step]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.steps button.done::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--mk)}
.panel{max-width:880px}
.lead{font-size:15px;color:var(--sub);margin-bottom:16px}
.memo{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;box-shadow:0 1px 0 var(--line)}
.who{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.av{width:40px;height:40px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-weight:700;border:1px solid var(--line)}
.reqt{font-size:17px;line-height:2.05;white-space:pre-wrap}
.seg{cursor:pointer;border-radius:3px;padding:2px 1px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.seg:hover{background:var(--panel)}
.seg.on{background:var(--mk);color:var(--mkink)}
.seg.miss{outline:2px dashed var(--bad);outline-offset:1px}
.seg.extra{background:transparent;text-decoration:line-through;color:var(--sub)}
.seg:focus-visible{outline:3px solid var(--ink)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.btn{min-height:44px;padding:10px 18px;border-radius:10px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer;font-weight:700}
.btn.g{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:focus-visible,.steps button:focus-visible,.opt:focus-within,textarea:focus-visible,input:focus-visible{outline:3px solid var(--mk);outline-offset:2px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.fb{border-radius:10px;padding:12px 16px;margin:10px 0;font-size:15px}
.fb.ok{background:var(--okbg)}
.fb.ng{background:var(--badbg)}
.fb.info{background:var(--panel)}
.fb b{display:block;margin-bottom:2px}
.keys{list-style:none;padding:0;margin:8px 0;display:grid;gap:6px}
.keys li{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:15px;align-items:baseline}
.tag{font-size:12px;padding:1px 8px;border-radius:5px;white-space:nowrap;border:1px solid var(--line)}
.tag.y{background:var(--mk);color:var(--mkink);border-color:var(--mk)}
.tag.r{border-color:var(--bad);color:var(--bad)}
.q{border-top:1px solid var(--line);padding:18px 0}
.q:first-child{border-top:0;padding-top:0}
.opts{display:grid;gap:8px;margin:10px 0}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--card);min-height:44px}
.opt input{margin-top:6px;width:18px;height:18px;accent-color:#101418}
.opt.right{border-color:var(--ink);box-shadow:inset 4px 0 0 var(--mk)}
.opt.wrong{border-color:var(--bad)}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.box{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--card)}
.box h3{font-size:15px}
.card{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;min-height:44px;font-size:15px}
.card:hover{border-color:var(--sub)}
.card .n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:Manrope;font-weight:800;font-size:13px}
.card .mv{margin-left:auto;display:flex;gap:4px;flex:none}
.card .mv span{border:1px solid var(--line);border-radius:6px;padding:0 7px;font-size:13px}
.card.x{border-color:var(--bad)}
.card.ok{box-shadow:inset 4px 0 0 var(--mk)}
.empty{color:var(--sub);font-size:14px;padding:16px;border:1px dashed var(--line);border-radius:10px;text-align:center}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--card);font-size:16px;line-height:1.7;resize:vertical}
input[type=text]{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--card);font-size:16px}
.ai{white-space:pre-wrap;font-size:15px;background:var(--panel);border-radius:10px;padding:14px 16px;margin-top:10px}
.ai::before{content:"AIコーチ";display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
.work{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.work>li{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--card)}
.wt{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.wt input{width:20px;height:20px;margin-top:4px;flex:none;accent-color:#101418}
.wt .why{display:block;font-size:14px;color:var(--sub)}
.hints{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0 32px}
.hints button{font-size:13px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:transparent;cursor:pointer;min-height:36px}
.hints button[aria-pressed=true]{background:var(--panel)}
.hint{margin:8px 0 0 32px;font-size:15px;padding:10px 12px;border-left:3px solid var(--mk);background:var(--panel);border-radius:0 8px 8px 0;white-space:pre-wrap}
.hint code,.code{font-family:ui-monospace,Consolas,monospace;font-size:14px;overflow-wrap:anywhere}
.files{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 0}
.files span{font-size:13px;background:var(--panel);border-radius:6px;padding:3px 9px}
.field{margin:0 0 20px}
.field label{display:block;font-weight:700;margin-bottom:6px}
.field textarea{min-height:120px;font-family:ui-monospace,Consolas,"BIZ UDPGothic",monospace;font-size:14px}
.field .hd{font-size:13px;color:var(--sub);margin-bottom:6px}
.res{font-size:14px;margin-top:6px}
.done-banner{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--mk);color:var(--mkink);border-radius:14px;padding:16px 20px;margin-bottom:20px}
.done-banner b{font-size:20px}
.navb{display:flex;justify-content:space-between;gap:10px;margin-top:28px;border-top:1px solid var(--line);padding-top:18px}
.solo{border-top:1px solid var(--line);margin-top:24px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:0 18px}
/* method */
.flow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin:18px 0 8px}
.fs{position:relative;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--card)}
.fs .k{font-size:22px;font-weight:700;display:inline-block;padding:0 4px;background:linear-gradient(transparent 58%,var(--mk) 58%);color:var(--ink)}
.fs h3{font-size:14px;color:var(--sub);font-weight:400;margin:6px 0}
.fs ul{margin:6px 0 0;padding-left:1.1em;font-size:14px}
.fs:not(:last-child)::after{content:"";position:absolute;right:-9px;top:26px;width:8px;height:8px;border-top:2px solid var(--sub);border-right:2px solid var(--sub);transform:rotate(45deg)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--sub);font-weight:400}
td.r,th.r{text-align:right}
.mini{font-size:13px;width:auto}
.mini td,.mini th{padding:5px 9px;border:1px solid var(--line)}
.mini .y{background:var(--mk);color:var(--mkink)}
/* data */
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:14px 0 24px}
.chain .t{border:2px solid var(--ink);border-radius:10px;padding:8px 12px;font-weight:700;background:var(--card)}
.chain .t small{display:block;font-weight:400;font-size:12px;color:var(--sub)}
.chain .a{font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center}
.chain .a::after{content:"→";font-size:20px;color:var(--ink);line-height:1}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.tcard{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--card)}
.tcard .bk{font-size:12px;color:var(--sub)}
.tcard h3{display:flex;justify-content:space-between;gap:8px}
.tcard .cols{font-size:13px;color:var(--sub);margin:6px 0}
.tcard ul{margin:6px 0 0;padding-left:1.1em;font-size:14px}
.warn{color:var(--bad)}
/* tools */
.filt{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}
.filt button{min-height:40px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:transparent;cursor:pointer}
.filt button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tl{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tl .tcard dl{margin:8px 0 0;font-size:14px;display:grid;grid-template-columns:4.5em 1fr;gap:4px 10px}
.tl dt{color:var(--sub)}.tl dd{margin:0}
.chk{list-style:none;padding:0;display:grid;gap:6px;columns:2}
.chk label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;min-height:36px}
.chk input{width:18px;height:18px;margin-top:5px;accent-color:#101418}
/* teacher */
.scroll{overflow-x:auto}
.prog td,.prog th{white-space:nowrap;font-size:14px}
.prog td.c{text-align:center}
.cellok{display:inline-block;min-width:28px;padding:1px 6px;border-radius:5px;background:var(--mk);color:var(--mkink);font-family:Manrope;font-weight:800;font-size:12px}
.cellp{color:var(--sub);font-size:12px}
details{border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px;background:var(--card)}
summary{cursor:pointer;font-weight:700;min-height:28px}
.dlg{position:fixed;inset:0;background:rgba(16,20,24,.5);display:grid;place-items:center;z-index:20;padding:16px}
.dlg>div{background:var(--bg);border-radius:14px;padding:22px;max-width:480px;width:100%}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:14px;z-index:30}
@media(max-width:1000px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}.flow{grid-template-columns:repeat(3,minmax(0,1fr))}.fs:nth-child(3)::after{display:none}}
@media(max-width:700px){.hero,.cols2{grid-template-columns:minmax(0,1fr)}.chk{columns:1}}
@media(max-width:600px){.sync{display:none}nav.tabs{flex-basis:100%;order:3;margin:0 -6px}.topin{gap:4px 12px}.board{grid-template-columns:minmax(0,1fr)}.flow{grid-template-columns:minmax(0,1fr)}.fs::after{display:none}.reqt{font-size:16px}
 table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;color:var(--sub);font-size:12px}.stack td:empty{display:none}}
@media(prefers-reduced-motion:reduce){.ticket{transition:none}.ticket:hover{transform:none}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>

<script>
const STAGES=[{"n":1,"t":"基本の型","s":"1つのシート・1つの条件で、型を身につける"},{"n":2,"t":"条件を組み合わせる","s":"AND・OR・期間・並べ替えを正確に"},{"n":3,"t":"データをつなぐ","s":"シートやファイルをまたいで突き合わせる"},{"n":4,"t":"実務の壁を越える","s":"欠けたデータ、あいまいな依頼、伝わる報告"},{"n":5,"t":"ひとりで解く","s":"ガイドなし。依頼を読み、手元のExcelで解き、報告する"}];
const MISSIONS=[{"id":"m01","stage":1,"stars":1,"mins":15,"old":"実践課題 問題1","title":"請求番号の照会","from":{"n":"佐藤","d":"経理部"},"files":["請求データ.xlsx ›「請求一覧」"],"tools":["VLOOKUP","絶対参照","表示形式"],"req":"お客様から問い合わせがあった請求が5件あります。下の[[請求番号|検索のキー。依頼者が渡してくれた情報が何かを最初に押さえる]]をもとに、それぞれの[[請求日・支払期限・ステータス|取り出す項目は3つ。請求金額などは不要]]を調べて、[[一覧で返してください|出力の形＝5行×4列の表]]。\n\nINV00011568／INV00005431／INV00000640／INV00002133／INV00010747","steps":[{"t":"請求一覧で、請求番号が何列目か・取り出したい列が何列目かを確認する","r":1,"w":"VLOOKUPは「検索範囲の左端の列」で探し、そこから数えた列番号の値を返す。先に列の位置関係を把握する。","h":["探す列（請求番号）より右側に、取り出したい列がありますか？","請求一覧はA:請求_id、B:契約_id、C:請求番号、D:請求日、E:支払期限 … H:status です。","範囲をC列から始めると、請求日=2列目、支払期限=3列目、status=6列目。"]},{"t":"作業用シートに5件の請求番号を縦に並べ、右に「請求日・支払期限・status」の見出しを作る","r":2,"w":"答えを書く「枠」を先に作ると、何を埋めればいいかがはっきりする。","h":["出力の形（5行×4列）を先に作ってしまいましょう。","新しいシートを追加し、A列に請求番号を貼り付けます。","A1:請求番号 B1:請求日 C1:支払期限 D1:status"]},{"t":"1件目の請求日をVLOOKUPで取り出す","r":3,"w":"まず1セルだけ作って正しいか確かめてから広げる。","h":["検索値・範囲・列番号・検索方法の4つを決めます。","検索方法はFALSE（完全一致）。TRUEや省略だと近い値を返してしまいます。","=VLOOKUP($A2,請求一覧!$C:$H,2,FALSE)"]},{"t":"範囲を絶対参照にして、支払期限・statusの列番号を変えながらオートフィルで残りを埋める","r":4,"w":"範囲が$で固定されていないと、コピーした先で範囲がずれて#N/Aになる。","h":["数式をコピーしたとき、ずれてほしい部分とずれてほしくない部分はどこ？","F4キーで $ を付けられます。","支払期限は列番号3、statusは列番号6。"]},{"t":"日付が「45443」のような数字で表示されたら、表示形式を日付に変える","r":5,"w":"Excelの日付は内部では通し番号（シリアル値）。値は正しく、見え方だけの問題。","h":["数字の正体は日付です。","右クリック → セルの書式設定 → 表示形式 → 日付。","ホームタブの表示形式ボックスで「短い日付形式」でもOK。"]}],"decoys":[{"t":"請求一覧を請求番号で並べ替えてから探す","w":"元データの並びを変えてしまう。VLOOKUPは並べ替え不要。"},{"t":"請求_idの列で検索する","w":"渡されたのは請求番号。キーを取り違えると全件#N/Aになる。"}],"checks":[{"t":"1件だけフィルターで実際に探して、VLOOKUPの結果と一致するか見た","w":"別の方法で同じ答えになれば、数式の誤りはほぼない。"},{"t":"#N/A が出ていない","w":"#N/Aは「見つからない」。キーの列、空白や全角の混入を疑う。"},{"t":"支払期限が請求日のおよそ30日後になっている","w":"データの規則性を知っていると、列番号のずれに気づける。"}],"report":{"to":"佐藤さん","pts":["結論（5件の状況を一言で）を最初に書いた","例外（滞納の1件）を目立たせた","詳細は表で添えた"]}},{"id":"m02","stage":1,"stars":1,"mins":15,"old":"実践課題 問題2","title":"大口請求の件数","from":{"n":"佐藤","d":"経理部"},"files":["請求データ.xlsx ›「請求一覧」"],"tools":["COUNTIF","条件の書き方","フィルター"],"req":"[[請求金額|対象の列。「支払金額」と取り違えやすい]]が[[90万円以上|900,000ちょうどを含む]]の請求が[[何件あるか|出力は件数（1つの数字）]]教えてください。\n来月以降もデータが更新されたら同じ表で数えたいので、[[数え直さなくても自動で反映されるようにしておいてほしい|手入力の数字ではなく、数式で数えておく]]です。","steps":[{"t":"請求一覧で「請求金額」の列を確認する（支払金額と取り違えない）","r":1,"w":"似た名前の列は事故のもと。見出しを声に出して確認。","h":["依頼に出てくる言葉と、列見出しを1つずつ照らし合わせましょう。","請求金額はF列、支払金額はG列です。","—"]},{"t":"空いているセルに基準額 900000 を入力し、隣に「基準額」とラベルを付ける","r":2,"w":"変わる可能性のある値は数式に埋め込まず、セルに出しておく。","h":["来月「80万以上で」と言われたら、どこを直せば済むようにしたいですか？","例：L1に「基準額」、M1に 900000","—"]},{"t":"COUNTIFで、請求金額の列から基準額以上のセルを数える","r":3,"w":"COUNTIF(範囲, 条件)。条件に比較演算子を使うときは文字列で書き、セルとは & でつなぐ。","h":["「何を」「どんな条件で」数えるかを分けて考えます。","条件は \">=900000\" のように文字列。セル参照と組み合わせるなら \">=\"&M1。","=COUNTIF(請求一覧!F:F,\">=\"&M1)"]},{"t":"フィルターの数値フィルター「指定の値以上」で同じ件数になるか検算する","r":4,"w":"関数とフィルターという別ルートで同じ数字が出れば安心して報告できる。","h":["左下のステータスバーに「15000 レコード中 ○ 個が見つかりました」と出ます。","データタブ → フィルター → 請求金額の▼ → 数値フィルター → 指定の値以上。","検算が終わったらフィルターをクリア。"]}],"decoys":[{"t":"statusを「支払い済」に絞ってから数える","w":"依頼にステータスの条件はない。書かれていない条件を勝手に足さない。"},{"t":"フィルター結果の件数をセルに手入力する","w":"データが更新されると古い数字のまま残る。依頼の「自動で反映」を満たさない。"}],"checks":[{"t":"フィルターで数えた件数とCOUNTIFの結果が一致した","w":"2つの方法の一致が最強の検算。"},{"t":"基準額のセルを一時的に変えると、結果が変わることを確かめた","w":"「自動で反映」の要件を自分で試す。確かめたら900000に戻す。"},{"t":"全体（15,000件）に対して多すぎも少なすぎもしない数か考えた","w":"およそ1割。桁が違えば条件の向き（以上/未満）を疑う。"}],"report":{"to":"佐藤さん","pts":["件数を最初に書いた","全体に対する割合など、数字の大きさが分かる情報を添えた","基準額セルの場所・使い方を伝えた"]}},{"id":"m03","stage":1,"stars":1,"mins":15,"old":"実践課題 問題3","title":"支払い済みの割合","from":{"n":"山本","d":"経営企画部"},"files":["請求データ.xlsx ›「請求一覧」"],"tools":["COUNTIF","COUNT","表示形式"],"req":"会議資料に載せたいので、[[請求全体のうち|分母＝全請求の件数。自分で数える]]、[[ステータスが支払い済になっている請求|分子＝statusが「支払い済」の件数]]の[[割合|件数÷件数。金額ベースではない]]を出してください。\n[[％で、小数第2位まで|表示形式の指定。例：12.34%]]お願いします。","steps":[{"t":"statusの▼を開いて、入っている値の種類と正確な表記を確認する","r":1,"w":"条件に使う値は必ずデータで確かめる。表記ゆれ・余計なスペースの発見にもなる。","h":["データに実際に入っている値を見たことがありますか？","フィルターの▼を押すと、その列の値が一覧で出ます。","値は「支払い済」「滞納」「発行済」の3種類。"]},{"t":"COUNTIFで「支払い済」の件数を数える","r":2,"w":"分子。","h":["条件の文字列は、データからコピーして貼ると表記ゆれを防げます。","status列はH列です。","=COUNTIF(請求一覧!H:H,\"支払い済\")"]},{"t":"COUNTで全請求の件数を数える","r":3,"w":"分母。数値の入った請求_id列を数えると見出しが入らない。","h":["見出し行を数えてしまわない方法は？","COUNTは数値の入ったセルだけを数えます。","=COUNT(請求一覧!A:A)"]},{"t":"分子÷分母を計算し、パーセント表示・小数第2位に設定する","r":4,"w":"0.8523… を手で 85.23 と打ち直さない。表示形式で整える。","h":["値は計算したまま、見え方だけを変えます。","ホームタブの「％」ボタン → 「小数点以下の表示桁数を増やす」を2回。","例：=M1/M2 → 表示形式で 12.34% のような形に"]}],"decoys":[{"t":"COUNTIFの条件を「支払済み」と入力する","w":"データの値は「支払い済」。表記が違うと0件になる。"},{"t":"計算結果を見て、表示された数字を手で入力し直す","w":"データが変わったときに追従しない。表示形式で整える。"}],"checks":[{"t":"支払い済＋滞納＋発行済 の件数の合計が全件数と一致した","w":"分類の合計＝全体。抜け漏れ・表記ゆれの発見に効く。"},{"t":"割合が0%〜100%の範囲で、感覚的にもおかしくない","w":"100%を超えたら分子と分母が逆。"}],"report":{"to":"山本さん","pts":["割合を最初に書いた","分子と分母（件数）を添えた","残りの内訳（滞納・発行済）にも触れた"]}},{"id":"m04","stage":2,"stars":2,"mins":25,"old":"実践課題 問題4","title":"今年の大口未払い一覧","from":{"n":"佐藤","d":"経理部"},"files":["請求データ.xlsx ›「請求一覧」"],"tools":["フィルター","並べ替え","シートのコピー"],"req":"今年に入ってからの大口の未払い請求を一覧にしてほしいです。\n条件は、ステータスが[[「発行済」か「滞納」|OR条件：どちらかに当てはまればよい]]で、[[請求金額90万円以上|AND条件。900,000を含む]]、[[請求日が2025年1月1日以降|AND条件。1月1日を含む]]のもの。\n[[請求_idの大きい順に並べて|並べ替え：降順]]、[[全部の列|請求_id〜updated_atの全10列]]を貼り付けてください。\n元の請求一覧はほかの人も使うので、[[絶対にいじらないでください|作業上の制約＝作業用コピーで作業する]]。","steps":[{"t":"請求一覧シートをコピーして、作業用シートを作る","r":1,"w":"元データを守る。","h":["何かを始める前に、壊れても困らない場所を用意します。","シート見出しを右クリック → 移動またはコピー → 「コピーを作成する」にチェック。","—"]},{"t":"statusで「発行済」「滞納」だけにチェックを入れる","r":2,"w":"同じ列の中のOR条件は、フィルターのチェックで表現できる。","h":["同じ列の中で「AかB」なら、チェックを2つ入れるだけです。","データタブ → フィルター → statusの▼ → 支払い済のチェックを外す。","—"]},{"t":"請求金額に数値フィルター「900000以上」をかける","r":3,"w":"別の列にフィルターを重ねるとAND条件になる。","h":["フィルターを重ねると、条件はどうつながる？","請求金額の▼ → 数値フィルター → 指定の値以上 → 900000。","—"]},{"t":"請求日に日付フィルター「2025/1/1以降」をかける","r":3,"w":"金額と日付はどちらを先にかけても結果は同じ。","h":["日付の列には「日付フィルター」が出ます。","請求日の▼ → 日付フィルター → ユーザー設定フィルター → 2025/1/1「以降」。","—"]},{"t":"請求_idで降順（大きい順）に並べ替える","r":4,"w":"並べ替えは抽出後でも前でもよいが、作業用シートで行う。","h":["依頼の「大きい順」をExcelの言葉にすると？","請求_idの▼ → 降順（大きい順）で並べ替え。","—"]},{"t":"見出しごと全列をコピーし、貼り付け位置に貼る","r":5,"w":"フィルターで隠れた行はコピーされない。","h":["どの範囲を選べば「全部の列」になりますか？","A1をクリック → Ctrl+Shift+→ → Ctrl+Shift+↓ で表全体を選択 → Ctrl+C。","手動で非表示にした行がある場合は Alt+; で可視セルだけを選択。"]}],"decoys":[{"t":"元の請求一覧で直接並べ替える","w":"依頼で禁止されている。"},{"t":"statusを「滞納」だけに絞る","w":"「発行済」が漏れる（OR条件の片方だけ）。"}],"checks":[{"t":"ステータスバーの「○個が見つかりました」と貼り付けた行数が一致した","w":"コピー漏れ・余計な行の混入に気づける。"},{"t":"貼り付けた結果で、請求金額の最小が90万以上・請求日の最古が2025/1/1以降・statusが2種類だけ","w":"結果側から条件を逆チェックする。"},{"t":"元の請求一覧が15,000行・元の並び（請求_idの小さい順）のまま","w":"制約を守れたかの確認。"}],"report":{"to":"佐藤さん","pts":["件数と内訳を最初に書いた","使った条件を明記した","貼り付け場所を伝えた"]}},{"id":"m05","stage":2,"stars":2,"mins":25,"old":"新規","title":"プラン別の契約状況表","from":{"n":"田中","d":"営業企画部"},"files":["一覧データ.xlsx ›「契約情報一覧」","マスタデータ.xlsx ›「契約プランマスタ」"],"tools":["COUNTIFS","VLOOKUP","集計表"],"req":"[[プランごとに|集計の単位＝プラン（3種類）]]、いま[[Active|current_status＝Active]]な契約が[[何件あるか|件数]]、表にまとめてもらえますか。\nあわせて、ざっくり月額の売上規模を知りたいので、[[各プランの基本料金×件数|ライセンス料は含めない。前提として報告に書く]]と、その[[合計|3プランの合計]]も出してください。\n[[プラン名で表示して|契約情報一覧にはプラン_id（数字）しかない→マスタから名前を引く]]ね。","steps":[{"t":"集計表の枠を作る（A列にプラン_id 1〜3、見出し：プラン名・Active件数・基本料金・金額）","r":1,"w":"答えの形を先に作る。","h":["最終的に何行何列の表になる？","プラン_idはマスタを見ると1〜3の3種類。","—"]},{"t":"プラン名と基本料金を、契約プランマスタからVLOOKUPで引く","r":2,"w":"IDを名前に変換する。","h":["マスタのどの列にプラン名・基本料金がある？","契約プランマスタは A:契約プラン_id B:プラン名 C:基本料金。","=VLOOKUP($A2,契約プランマスタ!$A:$C,2,FALSE)（基本料金は列番号3）"]},{"t":"COUNTIFSで、プラン_idが一致し、かつcurrent_statusがActiveの契約を数える","r":3,"w":"条件が2つになったらCOUNTIFS。","h":["COUNTIFは条件1つ、COUNTIFSは条件を何組でも並べられます。","契約情報一覧は C:プラン_id、G:current_status。","=COUNTIFS(契約情報一覧!$C:$C,$A2,契約情報一覧!$G:$G,\"Active\")"]},{"t":"金額＝件数×基本料金を計算し、合計行をSUMで作る","r":4,"w":"","h":["—","合計行は表の一番下に。","=C2*D2、合計は =SUM(E2:E4)"]}],"decoys":[{"t":"COUNTIF(プラン_id列, プラン_id) だけで数える","w":"Activeの条件が抜け、全ステータスの件数になる。"},{"t":"契約情報一覧にプラン名の列を手入力で追加する","w":"1,392行の手入力はミスのもと。マスタから引く。"}],"checks":[{"t":"3プランの件数の合計が、current_statusをActiveでフィルターした件数と一致した","w":"集計の合計＝絞り込んだ全体。"},{"t":"#N/A がない（プラン_idとマスタのIDが対応している）","w":""}],"report":{"to":"田中さん","pts":["合計金額と件数を最初に書いた","前提（基本料金のみ・ライセンス料は含まない）を書いた","表を添えた"]}},{"id":"m06","stage":2,"stars":2,"mins":25,"old":"実践課題 課題6","title":"自動継続なしの長期契約","from":{"n":"鈴木","d":"カスタマーサクセス部"},"files":["一覧データ.xlsx ›「契約情報一覧」「顧客一覧」","マスタデータ.xlsx ›「契約プランマスタ」"],"tools":["フィルター","VLOOKUP"],"req":"[[Activeで|current_status＝Active]]、[[自動継続がFALSE|自動継続列＝FALSE]]の契約のうち、[[契約終了日が2027年5月1日以降|5/1を含む]]のお客様をリストアップしてほしいです。\n[[法人名とプラン名が分かるように|契約情報一覧には両方ともない→別のシートから引く]]お願いします。","steps":[{"t":"契約情報一覧をコピーし、current_status・自動継続・契約終了日の3つでフィルターする","r":1,"w":"まず対象を絞る。","h":["3つの条件はAND？OR？","自動継続はTRUE/FALSEの列。▼でFALSEだけにチェック。","契約終了日 → 日付フィルター → 2027/5/1 以降"]},{"t":"絞り込んだ顧客_id・プラン_idを作業シートに貼る","r":2,"w":"結果表の土台。","h":["必要な列だけを持ってくると表がすっきりします。","顧客_idはB列、プラン_idはC列。","—"]},{"t":"顧客_idをキーに、顧客一覧から顧客名（法人名）をVLOOKUPで引く","r":3,"w":"","h":["顧客一覧の左端は顧客_id、その右が顧客名。","列番号は2。","=VLOOKUP($A2,顧客一覧!$A:$B,2,FALSE)"]},{"t":"プラン_idをキーに、契約プランマスタからプラン名を引く","r":3,"w":"","h":["M05と同じ要領です。","—","=VLOOKUP($B2,契約プランマスタ!$A:$B,2,FALSE)"]}],"decoys":[{"t":"顧客名を1件ずつ顧客一覧で検索してコピーする","w":"件数が増えると破綻する。VLOOKUPで引く。"}],"checks":[{"t":"フィルターの件数と、作業シートの行数が一致した","w":""},{"t":"#N/A がない","w":""},{"t":"結果の契約終了日がすべて2027/5/1以降になっている（作業シートにも終了日を引いて確かめた）","w":"結果側からの逆チェック。"}],"report":{"to":"鈴木さん","pts":["件数を最初に書いた","条件を書いた","一覧を添えた"]}},{"id":"m07","stage":3,"stars":3,"mins":35,"old":"実践課題 課題5","title":"古くからの契約の請求平均","from":{"n":"山本","d":"経営企画部"},"files":["一覧データ.xlsx ›「契約情報一覧」","請求データ.xlsx ›「請求一覧」"],"tools":["フィルター","作業列","COUNTIF","AVERAGEIF"],"req":"[[2022年以前に始まった契約|契約開始日が2022/12/31以前。「以前」は2022年を含むのが原則。人によっては「2022年より前」の意味で使うので、迷ったら確認するか、解釈を報告に書く]]で、[[今もActive|current_status＝Active]]、かつ[[契約_idが500以下|500を含む]]のものについて、[[その契約に紐づく請求|請求一覧のうち、対象契約の契約_idを持つ行]]の[[請求金額の平均|請求1件1件の平均]]を出してください。","steps":[{"t":"契約情報一覧のコピーで3条件をフィルターし、対象の契約_idを作業用シートに貼る","r":1,"w":"「どの契約が対象か」を先に確定する。","h":["開始日・ステータス・契約_idの3つ。","契約開始日 → 日付フィルター → 2022/12/31 以前。契約_id → 数値フィルター → 500以下。","対象リストの件数をメモしておく（検算に使う）。"]},{"t":"請求一覧のコピーに作業列「対象」を作り、その行の契約_idが対象リストにあるかを判定する","r":2,"w":"COUNTIFで「リストに何回出てくるか」を数えると、1なら対象、0なら対象外。","h":["「この契約_idは対象リストに入っている？」をセルごとに答えさせます。","COUNTIF(対象リスト, この /* ===== 採点エンジン（正解は持たず、ハッシュで照合） ===== */
const G=(()=>{
 const nf=s=>String(s??'').normalize('NFKC');
 const ns=s=>nf(s).replace(/\s+/g,'');
 const pad=n=>String(n).padStart(2,'0');
 function num(s){const t=nf(s).replace(/[,\s円¥件社人%％]/g,'');if(t===''||!/^-?\d*\.?\d+$/.test(t))return null;return parseFloat(t)}
 function date(s){const t=nf(s).trim();let m=t.match(/^(\d{4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/);
  if(m)return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  const n=num(t);if(n!=null&&n>20000&&n<80000){const d=new Date(Date.UTC(1899,11,30)+Math.floor(n)*864e5);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
  return t}
 function cell(v,t){if(t==='n'){const n=num(v);return n==null?ns(v):String(Math.round(n*100)/100)}if(t==='d')return date(v);if(t==='e')return ns(v).toLowerCase();return ns(v)}
 function rows(text){

 M.clarify.map((q,qi)=>{const sel=s.memo[qi]||[];const right=s.memoc&&sameArr(sel,q.a);

function pStep1(M,s){return pRead(M,s)+(M.clarify?pMemo(M,s):'')+`

function pSolo1(M,s){return`<p class="lead">このミッションにはガイドがありません。依頼を読み、何を・どのデータから・どんな形で出すかを自分で決めて、手元のExcelで解きましょう。参照してよいのは<a href="#method">考え方の型</a>・<a href="#data">データ地図</a>・<a href="#tools">道具箱</a>です。</p>

function pool(M){const items=M.steps.map((x,i)=>({k:'s'+i,t:x.t})).concat(M.decoys.map((x,i)=>({k:'d'+i,t:x.t})));
 let h=0;for(const c of M.id)h=(h*31+c.charCodeAt(0))>>>0;const r=()=>(h=(h*1103515245+12345)>>>0)/4294967296;
 for(let i=items.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[items[i],items[j]]=[items[j],items[i]]}return items}
function pPlan(M,s){const P=pool(M);const by=Object.fromEntries(P.map(p=>[p.k,p]));const rest=P.filter(p=>!s.plan.includes(p.k));
 let ev='';if(s.planc){const real=s.plan.filter(k=>k[0]==='s');const dec=s.plan.filter(k=>k[0]==='d');const miss=M.steps.length-real.length;
  let mx=0;const late=[];real.forEach(k=>{const r=M.steps[+k.slice(1)].r;if(r<mx)late.push(k);mx=Math.max(mx,r)});
  const good=!dec.length&&!miss&&!late.length;
  ev=`<div class="fb ${good?'ok':'info'}"><b>${good?'よい手順です':'見直しポイント'}</b>${good?'不要な作業を入れず、順番も筋が通っています。':''}
   ${dec.map(k=>`<div>・入れなくてよい作業：「${esc(by[k].t)}」— ${esc(M.decoys[+k.slice(1)].w)}</div>`).join('')}
   ${miss?`<div>・足りない作業が${miss}つあります（下の模範手順で確認）。</div>`:''}
   ${late.map(k=>`<div>・「${esc(by[k].t)}」は、もっと前にやる作業です。</div>`).join('')}</div>
   <div class="box" style="margin-top:12px"><h3>模範の手順と理由</h3><ol style="margin:6px 0 0;padding-left:1.3em">${M.steps.map(x=>`<li style="margin-bottom:6px">${esc(x.t)}${x.w?`<div class="small sub">${esc(x.w)}</div>`:''}</li>`).join('')}</ol></div>`}
 return`<p class="lead">作業カードから必要なものだけを選び、やる順に並べます。<strong>混ざっている「やらなくてよい作業」</strong>に注意。</p>
 <div class="cols2"><div class="box"><h3>作業カード</h3>${rest.length?rest.map(p=>`<button class="card" data-a="padd" data-k="${p.k}" ${s.planc?'disabled':''}><span>${esc(p.t)}</span></button>`).join(''):'<div class="empty">すべて選びました</div>'}</div>
 <div class="box"><h3>自分の手順</h3>${s.plan.length?s.plan.map((k,i)=>{const isD=k[0]==='d';const c=s.planc?(isD?'x':'ok'):'';return`<div class="card ${c}"><span class="n">${i+1}</span><span>${esc(by[k].t)}</span>${s.planc?'':`<span class="mv"><span role="button" tabindex="0" data-a="pup" data-i="${i}" aria-label="上へ">↑</span><span role="button" tabindex="0" data-a="pdn" data-i="${i}" aria-label="下へ">↓</span><span role="button" tabindex="0" data-a="pdel" data-i="${i}" aria-label="外す">×</span></span>`}</div>`}).join(''):'<div class="empty">左のカードをクリックして追加</div>'}</div></div>
 <div class="btns">${s.planc?`<button class="btn g" data-a="preset">並べ直す</button>`:`<button class="btn" data-a="pcheck" ${s.plan.length?'':'disabled'}>答え合わせ</button>`}</div>${ev}
 <details style="margin-top:18px"><summary>自分の言葉で手順を書く（任意）</summary><p class="small sub">カードにない工夫や、検算の方法も書いてみましょう。AIコーチが、答えを言わずにヒントを返します。</p>
 <textarea data-a="pt" placeholder="例：1. まず○○シートをコピーする　2. …">${esc(s.pt)}</textarea>${aiBtn('plan')}<div id="ai-plan"></div></details>`}
const aiBtn=k=>SAMPLE?`<div class="btns"><button class="btn g" data-a="ai" data-k="${k}">AIコーチに見てもらう</button></div>`:'';

function pWork(M,s){const n=M.steps.length,rev=Math.min(s.rev||0,n);

 ${M.decoys.length?`<details><summary>やりがちな落とし穴</summary><ul style="margin:8px 0 0;padding-left:1.2em">${M.decoys.map(d=>`<li><strong>${esc(d.t)}</strong><div class="small sub">${esc(d.w)}</div></li>`).join('')}</ul></details>`:''}`}

function pVerify(M,s){return`<p class="lead"><strong>別の方法で同じ数字になるか</strong>が一番確かな検算です。済んだものにチェック。</p>
 <ul class="work">${M.checks.map((c,i)=>`<li><label class="wt"><input type="checkbox" data-a="ver" data-i="${i}" ${s.ver[i]?'checked':''}><span><strong>${esc(c.t)}</strong>${c.w?`<span class="why">${esc(c.w)}</span>`:''}</span></label></li>`).join('')}</ul>

function pSubmit(M,s){const F=PUB.fields[M.id];
 const fld=(f,i)=>{const r=s.res[i];const hd=f.k==='table'?`Excelで範囲を選んでCtrl+C → ここに貼り付け（見出し行はあってもなくてもOK）。列：<strong>${f.cols.map(c=>esc(c.h)).join('・')}</strong>`:f.k==='pct'?'例：12.34%':f.k==='num'?'数字だけ（例：1234）':'名前だけを入力';
  return`<div class="field"><label for="f${i}">${esc(f.label)}</label><div class="hd">${hd}</div>${f.k==='table'?`<textarea id="f${i}" data-a="inp" data-i="${i}" spellcheck="false">${esc(s.inp[i]||'')}</textarea>`:`<input type="text" id="f${i}" data-a="inp" data-i="${i}" value="${esc(s.inp[i]||'')}" inputmode="${f.k==='text'?'text':'decimal'}" autocomplete="off">`}
  ${r?`<div class="fb ${r.ok?'ok':'ng'} res"><b>${r.ok?'正解':'まだ'}</b>${esc(r.msg)}</div>`:''}</div>`};
 return`<p class="lead">結果を入力・貼り付けて判定します。間違えたときは、ありがちな原因を返します。</p>

async function coach(id,k){const M=MI[id],s=ms(id);const box=document.getElementById('ai-'+k);if(!SAMPLE||!box)return;
 const text=k==='plan'?s.pt:s.rep;if(!text||text.trim().length<10){box.innerHTML='<div class="fb info">もう少し書いてから見てもらいましょう。</div>';return}

 const ctx='# 依頼（'+M.from.d+' '+M.from.n+'さん）\n'+plainReq(M.req)+'\n\n# 依頼の要点\n'+segs(M.req).filter(x=>x.k).map(x=>'- '+x.t+'：'+x.w).join('\n');
 const body=k==='plan'?'\n\n# 講師が想定する手順（受講者には見せない）\n'+M.steps.map((x,i)=>(i+1)+'. '+x.t).join('\n')+'\n\n# 受講者が書いた手順\n'+text+'\n\n# 出力\n日本語で250〜400字。次の3つの見出しをこの順で使う：「よい点」「見直したい点」「考えてみよう」。見直したい点は最大2つ。想定手順を丸写しせず、抜けや順番の問題を問いかけの形で示す。記号による装飾（#や*）は使わない。'
  :'\n\n# 報告のチェックポイント\n'+['結論が最初の一文にある','数字に単位と分母がある','条件・解釈・前提が書かれている','簡潔で、依頼者がそのまま使える'].concat(M.report.pts).join('\n')+(s.sec?'\n\n# 参考：講師の模範例（受講者には見せない。数値の正誤はここで判定しない）\n'+s.sec.model:'')+'\n\n# 受講者の報告文\n'+text+'\n\n# 出力\n日本語で200〜350字。見出しは「よい点」「直すともっと伝わる点」「書き直しの一言例」。書き直し例は受講者の文を1文だけ改善したもの。模範例の文面を写さない。記号による装飾（#や*）は使わない。';
 box.innerHTML='<div class="ai" aria-live="polite">考えています…</div>';const out=box.firstChild;
 try{const r=await SAMPLE([{role:'user',content:sys+'\n\n'+ctx+body}],{onText:({text})=>{out.textContent=text},cache:false});out.textContent=r.text}
 catch(e){out.textContent=e&&e.code==='rate_limited'?'混み合っています。少し時間をおいてもう一度試してください。':e&&e.code==='not_granted'?'AIコーチはこの環境では使えません。':'AIコーチに接続できませんでした。'}}

  !docs.length?`<div class="fb info">まだ受講者の記録はありません。受講者がミッションを始めると、ここに表示されます。共有時は受講者を「投稿者（Contributor）」以上にしてください。</div>`:
  `<div class="scroll"><table class="prog"><thead><tr><th>受講者</th><th class="r">解決</th>${MISSIONS.map(m=>`<th class="c">${m.id.toUpperCase()}</th>`).join('')}<th>最終更新</th></tr></thead><tbody>${docs.map(d=>{const m=d.s?.m||{};const n=MISSIONS.filter(x=>m[x.id]?.ok).length;
   return`<tr><td>${esc(name(d.id))}</td><td class="r num">${n}</td>${MISSIONS.map(x=>{const v=m[x.id];return`<td class="c">${!v?'<span class="cellp">–</span>':v.ok?`<span class="cellok" title="判定${v.att}回・ヒント${Object.keys(v.hints||{}).length}">${v.att}/${Object.keys(v.hints||{}).length}</span>`:v.gu?'<span class="cellp">解説</span>':`<span class="cellp">${esc(stepsOf(x.id)[v.step]||'')}</span>`}</td>`}).join('')}<td class="small">${d.u?new Date(d.u).toLocaleString('ja-JP'):''}</td></tr>`}).join('')}</tbody></table></div>
  <p class="small sub">黄色のセル＝解決（判定回数／ヒント数）。灰色＝進行中のステップ。</p>`}
 ${aggL.length?`<h2 style="margin-top:24px">よくあるつまずき（全受講者）</h2><table class="stack"><thead><tr><th>課題</th><th class="r">回数</th><th>内容</th></tr></thead><tbody>${aggL.map(([k,n])=>`<tr><td>${esc(k.split(':')[0].toUpperCase())}</td><td class="r num">${n}</td><td>${esc(diagMsg[k]||k)}</td></tr>`).join('')}</tbody></table>`:''}
 ${docs.length?`<h2 style="margin-top:24px">受講者の手順メモと報告文</h2>${docs.map(d=>{const m=d.s?.m||{};const rows=MISSIONS.filter(x=>m[x.id]&&(m[x.id].rep||m[x.id].pt));return rows.length?`<details><summary>${esc(name(d.id))}（${rows.length}件）</summary>${rows.map(x=>`<div style="margin-top:10px"><strong>${x.id.toUpperCase()} ${esc(x.title)}</strong>${m[x.id].pt?`<div class="small sub">手順メモ</div><div class="ai" style="margin-top:2px">${esc(m[x.id].pt)}</div>`:''}${m[x.id].rep?`<div class="small sub">報告文</div><div class="ai" style="margin-top:2px">${esc(m[x.id].rep)}</div>`:''}</div>`).join('')}</details>`:''}).join('')}`:''}
 </section>
 <section class="band" style="padding-top:0"><h2>ミッション別 指導メモと正解</h2>
 ${MISSIONS.map(M=>{const A=T.m[M.id];return`<details><summary>${M.id.toUpperCase()} ${esc(M.title)}　<span class="sub small" style="font-weight:400">${esc(A.old)}</span></summary>
  <p style="margin-top:10px"><strong>正解：</strong>${esc(A.summary)}</p>
  ${A.fields.map(f=>f.k==='table'?`<div class="scroll"><table class="mini"><thead><tr>${f.cols.map(c=>`<th>${esc(c.h)}</th>`).join('')}</tr></thead><tbody>${f.rows.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:`<div class="small">${esc(f.label)}：<strong>${esc(f.k==='text'?f.accept.join('／'):f.k==='pct'?f.v.toFixed(2)+'%':Number(f.v).toLocaleString())}</strong></div>`).join('')}
  ${A.table?`<div class="scroll" style="margin-top:8px"><table class="mini"><thead><tr><th>業界</th><th>請求件数</th><th>滞納件数</th><th>滞納率</th></tr></thead><tbody>${A.table.map(r=>`<tr><td>${esc(r[0])}</td><td class="r">${r[1].toLocaleString()}</td><td class="r">${r[2]}</td><td class="r">${r[3].toFixed(2)}%</td></tr>`).join('')}</tbody></table></div>`:''}
  <p style="margin-top:10px"><strong>狙い：</strong>${esc(A.teach.aim)}</p>
  <p><strong>よくあるつまずき：</strong>${A.teach.stumble.map(esc).join('／')}</p>
  <p><strong>問いかけ例：</strong>${A.teach.ask.map(esc).join('／')}</p></details>`}).join('')}</section>
 <section class="band" style="padding-top:0"><h2>現行教材から見つかった改善点</h2><table class="stack"><thead><tr><th>項目</th><th>内容</th><th>このアプリでの対応</th></tr></thead><tbody>${T.fixes.map(f=>`<tr><td><strong>${esc(f[0])}</strong></td><td>${esc(f[1])}</td><td>${esc(f[2])}</td></tr>`).join('')}</tbody></table></section>`;
 resolveNames()}
async function resolveNames(){if(!U||!TDOCS)return;const ids=TDOCS.map(d=>d.id).filter(i=>!TNAMES[i]);if(!ids.length)return;
 try{const ps=await U.profiles(ids);let ch=false;ids.forEach(i=>{const n=ps?.[i]?.name;if(n){TNAMES[i]=n;ch=true}});if(ch&&location.hash==='#teacher')teacher()}catch(e){}}
function subTeacher(){if(!DB||tUnsub||!canTeach)return;
 try{tUnsub=DB.collection('progress').onSnapshot(sn=>{TDOCS=sn.docs.map(d=>({id:d.id,...(d.data()||{})})).sort((a,b)=>(b.u||0)-(a.u||0));if(location.hash==='#teacher')teacher()},e=>{tUnsub=null})}catch(e){}}

let judging=false;
async function judge(id){if(judging)return;judging=true;const s=ms(id),F=PUB.fields[id];const btn=document.getElementById('judge');if(btn){btn.disabled=true;btn.textContent='判定中…'}
 try{let all=true;const canon=[];let th='';s.att++;
  for(const [i,f] of F.entries()){const v=document.getElementById('f'+i)?.value??'';s.inp[i]=v;const r=await G.grade(f,id+':'+i,v);s.res[i]={ok:r.ok,msg:r.msg};
   if(r.ok){canon.push(r.canon);if(r.h)th=r.h}else{all=false;const c=r.code||'other';s.diag[c]=(s.diag[c]||0)+1}}
  if(all){try{const sb=PUB.sec[id];s.sec=await G.unseal(sb.iv?sb:sb[th],canon.join('␞'),PUB.salt+'|sec|'+id,PUB.itSec)}catch(e){}if(!s.ok){s.ok=true;s.t1=Date.now()}}
 }finally{judging=false}
 if(cur()===id)rerender(1);else save()}
async function unlockTeacher(pass,manual){if(!pass)return;const m=document.getElementById('pcm');if(m)m.textContent='確認中…';
 try{T=await G.unseal(PUB.teacher,pass,PUB.salt+'|teacher',PUB.itT);try{localStorage.setItem(TKEY,pass)}catch(e){}
  document.getElementById('tlink').hidden=false;if(location.hash==='#teacher')teacher()}
 catch(e){T=null;if(manual&&m)m.textContent='パスコードが違います。'}}

/* ---------- ルーター ---------- */
function route(){const h=location.hash.slice(1)||'home';nav(h);
 if(MI[h])mission(h);else if(h==='method')method();else if(h==='data')datamap();else if(h==='tools')tools();else if(h==='teacher')teacher();else home();
 window.scrollTo(0,0)}
const cur=()=>{const h=location.hash.slice(1);return MI[h]?h:null};
function rerender(keepScroll){const y=window.scrollY;panel(cur());save();sendSheet(cur());if(keepScroll)window.scrollTo(0,y)}

app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;const id=cur();const s=id&&ms(id);const M=id&&MI[id];
 if(a==='step'){const i=+b.dataset.i;if(i<0||i>2)return;if(s.step===0&&i>0)s.rd=true;s.step=i;rerender();const top=document.querySelector('.steps').getBoundingClientRect().top+window.scrollY-70;if(window.scrollY>top)window.scrollTo(0,top);return}
 if(a==='mk'){if(s.mkc)return;const i=+b.dataset.i;s.mk=s.mk.includes(i)?s.mk.filter(x=>x!==i):s.mk.concat(i);rerender(1);return}
 if(a==='mkcheck'){s.mkc=true;rerender(1);return}
 if(a==='mkreset'){s.mkc=false;s.mk=[];rerender(1);return}
 if(a==='memocheck'){if(M.clarify.some((q,i)=>!(s.memo[i]||[]).length)){toast('すべての問いに答えてから答え合わせしましょう');return}s.memoc=true;rerender(1);return}
 if(a==='memoreset'){s.memoc=false;rerender(1);return}
 if(a==='padd'){s.plan.push(b.dataset.k);rerender(1);return}
 if(a==='pup'||a==='pdn'||a==='pdel'){const i=+b.dataset.i;if(a==='pdel')s.plan.splice(i,1);else{const j=a==='pup'?i-1:i+1;if(j<0||j>=s.plan.length)return;[s.plan[i],s.plan[j]]=[s.plan[j],s.plan[i]]}rerender(1);return}
 if(a==='pcheck'){s.planc=true;rerender(1);return}
 if(a==='preset'){s.planc=false;s.plan=[];rerender(1);return}
 if(a==='rev'||a==='revall'){const n=M.steps.length;s.rev=a==='rev'?Math.min(n,(s.rev||0)+1):n;rerender(1);return}
 if(a==='hint'){s.hints[b.dataset.i+'-'+b.dataset.j]=true;rerender(1);return}
 if(a==='judge'){judge(id);return}
 if(a==='model'){if(s.sec){s.repShown=true;rerender(1)}return}
 if(a==='ai'){coach(id,b.dataset.k);return}
 if(a==='copyprog'){copy(progText());return}
 if(a==='tf'){tFilter=b.dataset.g;tools();return}
 if(a==='tlogout'){T=null;try{localStorage.removeItem(TKEY)}catch(e){}document.getElementById('tlink').hidden=true;location.hash='#home';return}
 if(a==='pass'){unlockTeacher(document.getElementById('pc').value.trim(),true);return}
});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pc'){unlockTeacher(e.target.value.trim(),true);return}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button]')){e.preventDefault();e.target.click()}});
app.addEventListener('change',e=>{const t=e.target;const a=t.dataset.a;const id=cur();
 if(a==='memo'){const s=ms(id),q=+t.dataset.q,o=+t.dataset.o;const multi=MI[id].clarify[q].m;let sel=s.memo[q]||[];sel=multi?(t.checked?sel.concat(o):sel.filter(x=>x!==o)):[o];s.memo[q]=sel;save();return}
 if(a==='work'||a==='ver'){const s=ms(id);const k=a;if(t.checked)s[k][t.dataset.i]=true;else delete s[k][t.dataset.i];save();refreshSteps(id);return}
 if(a==='basic'){if(t.checked)S.basics[t.dataset.i]=true;else delete S.basics[t.dataset.i];save()}
});
app.addEventListener('input',e=>{if(e.target.dataset.a==='name'){S.name=e.target.value.trim();save();sheetLabel();return}});
app.addEventListener('input',e=>{const t=e.target;const a=t.dataset.a;const id=cur();if(!id)return;const s=ms(id);
 if(a==='pt'){s.pt=t.value;save()}else if(a==='rep'){s.rep=t.value;save();sendSheet(id)}else if(a==='inp'){s.inp[t.dataset.i]=t.value;save()}});
addEventListener('hashchange',route);
route();sheetLabel();
try{const p=localStorage.getItem(TKEY);if(p)unlockTeacher(p,false)}catch(e){}

/* ---------- Claude連携（あれば有効化） ---------- */
(async()=>{const use=window.claude&&window.claude.use;if(!use)return;
 try{[U,DB,SAMPLE]=await Promise.all([use('user'),use('db'),use('sample')])}catch(e){}
 if(SAMPLE&&cur()&&[0,2].includes(ms(cur()).step))panel(cur());
 if(U){try{canTeach=!!(await U.canEdit())||!!(await U.isOwner())}catch(e){}}
 if(DB&&U){try{UID=await U.id()}catch(e){}}
 if(DB&&UID){setSync('クラウドと同期中…');const to=setTimeout(()=>setSync('この端末に保存（クラウドに接続できません）'),10000);
  try{const sn=await DB.doc('progress/'+UID).get();clearTimeout(to);const d=sn.exists?sn.data():null;
   if(d&&d.s&&(d.u||0)>(S.u||0)){S=d.s;if(!S.basics)S.basics={};try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){};route()}
   remote='cloud';setSync('クラウドに保存');if((S.u||0)>((d&&d.u)||0)&&Object.keys(S.m).length){dirty=true;push()}}
  catch(e){clearTimeout(to);setSync('この端末に保存')}}
 if(canTeach){subTeacher();if(location.hash==='#teacher')teacher()}
})();
