<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Excel実務トレーニング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 新人研修のガイド。親しみやすく、迷わせない。
   IDEA: 研修ノート。ステージごとに色分けされたインデックスと、蛍光ペンで要点を引く依頼票。
   PICTURE: ホームの「1ミッションの流れ」（アイコン付き3ステップ）と、色分けされたステージ別のミッション一覧。
   COLOUR and TYPE: 明るい地にネイビーの文字。操作は青、ステージ1〜5は緑・青・紫・橙・紺。見出しZen Kaku Gothic New、本文BIZ UDPゴシック。
   LAYOUT: 本文1180px。ミッション一覧はステージごとの横帯。ミッション画面は色帯の見出し＋番号付きステッパー＋白いカード。 */
:root{color-scheme:light dark;
 --bg:light-dark(#f4f6fb,#0e131c);--card:light-dark(#ffffff,#161d29);--ink:light-dark(#1b2333,#e8edf5);--sub:light-dark(#5a6478,#a1abbd);
 --line:light-dark(#e2e7f0,#283244);--soft:light-dark(#eef2f9,#1c2433);
 --pri:light-dark(#2f5bea,#86a2ff);--prisoft:light-dark(#e8eeff,#1d2850);
 --ok:light-dark(#168a4f,#5fd394);--oksoft:light-dark(#e6f6ec,#14301f);
 --bad:light-dark(#d93a3f,#ff8b8e);--badsoft:light-dark(#fdecec,#3a1c1e);
 --mk:#ffd84a;--mkink:#1b2333;
 --s1:light-dark(#0f9a83,#4fd1b8);--s2:light-dark(#2f80ed,#7fb2ff);--s3:light-dark(#7c5cf0,#b5a1ff);--s4:light-dark(#e07a1f,#ffb36b);--s5:light-dark(#283a63,#9fb2dd);
 --r:12px;--shadow:0 1px 2px light-dark(rgba(27,35,51,.06),rgba(0,0,0,.3)),0 6px 18px -8px light-dark(rgba(27,35,51,.14),rgba(0,0,0,.5));
 --hfont:"Zen Kaku Gothic New","BIZ UDPGothic",sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.75 "BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;overflow-x:clip}
a{color:var(--pri)}
button,input,textarea,select{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.num{font-family:var(--hfont);font-weight:900;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 max(4vw,16px)}
.ico{width:1.15em;height:1.15em;flex:none;vertical-align:-.18em}

header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:18px;min-height:62px;flex-wrap:wrap;padding-block:6px}
.brand{font-family:var(--hfont);font-weight:900;font-size:18px;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand i{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--pri);color:#fff;font-style:normal}
nav.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
nav.tabs a{flex:none;display:flex;align-items:center;gap:6px;text-decoration:none;padding:8px 14px;border-radius:99px;font-size:15px;color:var(--sub);white-space:nowrap}
nav.tabs a:hover{background:var(--soft);color:var(--ink)}
nav.tabs a[aria-current=page]{background:var(--prisoft);color:var(--pri);font-weight:700}
.sync{font-size:13px;color:var(--sub);white-space:nowrap}
main{padding-bottom:80px}

h1{font-family:var(--hfont);font-weight:900;font-size:clamp(30px,4.2vw,46px);line-height:1.25;margin:0 0 14px;letter-spacing:.01em}
h1 .ph{display:inline-block}
h2{font-family:var(--hfont);font-weight:900;font-size:24px;line-height:1.4;margin:0 0 10px}
h3{font-family:var(--hfont);font-weight:700;font-size:18px;line-height:1.5;margin:0 0 6px}
p{margin:0 0 12px}
.sub{color:var(--sub)}.small{font-size:14px}
.band{padding:clamp(24px,4vw,48px) 0}
.mk{background:linear-gradient(transparent 58%,var(--mk) 58%);color:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}

/* hero */
.herobg{background:linear-gradient(180deg,var(--prisoft),var(--bg));border-bottom:1px solid var(--line)}
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:center;padding:clamp(28px,5vw,60px) 0}
.hero .lead{font-size:17px;color:var(--ink)}
.progcard{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:16px 18px;margin-top:20px}
.progcard .pbar{flex:1 1 220px;height:12px;border-radius:99px;background:var(--soft);overflow:hidden}
.progcard .pbar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.progcard .cnt{font-size:15px}.progcard .cnt .num{font-size:30px;color:var(--ok)}
.flow3{display:grid;gap:10px;position:relative}
.fstep{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:center;padding:16px 18px}
.fstep .bub{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--prisoft);color:var(--pri)}
.fstep .bub svg{width:28px;height:28px}
.fstep b{font-family:var(--hfont);font-size:18px;display:block}
.fstep span{font-size:14px;color:var(--sub)}
.fstep:nth-child(2) .bub{background:var(--oksoft);color:var(--ok)}
.fstep:nth-child(3) .bub{background:light-dark(#fff3e2,#3a2a14);color:var(--s4)}
.flow3 .arrow{justify-self:start;margin-left:38px;height:10px;width:2px;background:var(--line)}
.infos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:24px 0 8px}
.infos>div{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;font-size:14px}
.infos .ic{width:38px;height:38px;border-radius:10px;background:var(--soft);display:grid;place-items:center;color:var(--pri);flex:none}
.infos b{display:block;font-size:13px;color:var(--sub);font-weight:400}

/* missions board */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:36px 0 14px}
.stagerow{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;padding:18px;margin-bottom:14px;border-left:6px solid var(--sc)}
.stagerow .sl .pill{display:inline-flex;align-items:center;gap:6px;background:var(--sc);color:#fff;border-radius:99px;padding:2px 12px;font-size:13px;font-weight:700}
:root[data-theme=dark] .stagerow .sl .pill{color:#0e131c}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .stagerow .sl .pill{color:#0e131c}}
.stagerow .sl h3{margin:8px 0 4px;font-size:20px}
.stagerow .sl p{font-size:14px;color:var(--sub);margin:0 0 8px}
.stagerow .sl .sp{font-size:13px;color:var(--sub)}
.tks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.ticket{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;position:relative;overflow:hidden;transition:transform .12s,box-shadow .12s}
.ticket::before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:var(--sc)}
.ticket:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--sc)}
.tk-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--sub);margin-top:2px}
.tk-h .id{font-weight:700;color:var(--sc)}
.tk-t{font-family:var(--hfont);font-weight:700;font-size:17px;line-height:1.45;margin:6px 0 6px;flex:1}
.tk-f{font-size:13px;color:var(--sub);display:flex;gap:4px 12px;flex-wrap:wrap;align-items:center}
.tk-h .l{display:flex;gap:8px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap;background:var(--soft);color:var(--sub)}
.badge.d{background:var(--oksoft);color:var(--ok)}
.badge.p{background:var(--prisoft);color:var(--pri)}
.badge.g{background:light-dark(#fff3e2,#3a2a14);color:var(--s4)}
.stars{letter-spacing:1px;color:light-dark(#e0a100,#ffd166);font-size:13px}.stars .off{color:var(--line)}

/* mission page */
.mband{background:linear-gradient(180deg,color-mix(in srgb,var(--sc) 14%,var(--bg)),var(--bg));border-bottom:1px solid var(--line)}
.mhead{display:grid;gap:8px;padding:20px 0 18px}
.back{font-size:14px;color:var(--sub);text-decoration:none;display:inline-flex;gap:4px;align-items:center}
.back:hover{color:var(--pri)}
.meta{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:14px;color:var(--sub);align-items:center}
.meta .pill{background:var(--sc);color:#fff;border-radius:99px;padding:1px 12px;font-weight:700;font-size:13px}
:root[data-theme=dark] .meta .pill{color:#0e131c}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .meta .pill{color:#0e131c}}
.files{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 0}
.files span{display:inline-flex;align-items:center;gap:6px;font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 12px}
.steps{display:flex;align-items:flex-start;gap:0;margin:22px 0 18px;padding:0;list-style:none}
.steps button{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;cursor:pointer;position:relative;padding:0 4px;color:var(--sub);font-size:14px;min-height:44px}
.steps button .c{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--hfont);font-weight:900;font-size:17px;background:var(--card);border:2px solid var(--line);color:var(--sub);position:relative;z-index:1}
.steps button:not(:last-child)::after{content:"";position:absolute;top:20px;left:calc(50% + 24px);right:calc(-50% + 24px);height:2px;background:var(--line)}
.steps button.done .c{background:var(--ok);border-color:var(--ok);color:#fff}
.steps button.done:not(:last-child)::after{background:var(--ok)}
.steps button[aria-current=step]{color:var(--ink);font-weight:700}
.steps button[aria-current=step] .c{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 0 0 5px var(--prisoft)}
.panel{padding:clamp(18px,3vw,30px);margin-top:4px}
.panel>*{max-width:860px}
.panel h2{font-size:21px;margin-top:6px;display:flex;align-items:center;gap:8px}
.lead{font-size:15px;color:var(--sub);margin-bottom:16px}
.memo{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 22px;position:relative}
.memo::before{content:"依頼";position:absolute;top:-11px;left:18px;background:var(--pri);color:#fff;font-size:12px;font-weight:700;border-radius:99px;padding:1px 10px}
:root[data-theme=dark] .memo::before{color:#0e131c}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .memo::before{color:#0e131c}}
.memo.plain::before{display:none}
.who{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.av{width:42px;height:42px;border-radius:50%;background:var(--prisoft);color:var(--pri);display:grid;place-items:center;font-weight:700;font-family:var(--hfont)}
.reqt{font-size:17px;line-height:2.1;white-space:pre-wrap}
.seg{cursor:pointer;border-radius:4px;padding:2px 1px;-webkit-box-decoration-break:clone;box-decoration-break:clone;border-bottom:1px dashed transparent}
.seg:hover{background:var(--soft);border-bottom-color:var(--sub)}
.seg.on{background:var(--mk);color:var(--mkink)}
.seg.miss{outline:2px dashed var(--bad);outline-offset:1px}
.seg.extra{background:transparent;text-decoration:line-through;color:var(--sub)}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.btn{min-height:46px;padding:10px 20px;border-radius:10px;border:1px solid var(--pri);background:var(--pri);color:#fff;cursor:pointer;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.07)}
:root[data-theme=dark] .btn:not(.g){color:#0e131c}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .btn:not(.g){color:#0e131c}}
.btn.g{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.g:hover{border-color:var(--pri);color:var(--pri);filter:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.fb{border-radius:10px;padding:12px 16px 12px 46px;margin:10px 0;font-size:15px;position:relative}
.fb::before{position:absolute;left:14px;top:12px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:900;color:#fff}
.fb.ok{background:var(--oksoft)}.fb.ok::before{content:"✓";background:var(--ok)}
.fb.ng{background:var(--badsoft)}.fb.ng::before{content:"!";background:var(--bad)}
.fb.info{background:var(--soft)}.fb.info::before{content:"i";background:var(--sub);font-family:serif;font-style:italic}
.fb b{display:block;margin-bottom:2px}
.keys{list-style:none;padding:0;margin:10px 0;display:grid;gap:6px}
.keys li{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:15px;align-items:baseline}
.tag{font-size:12px;font-weight:700;padding:1px 9px;border-radius:99px;white-space:nowrap}
.tag.y{background:var(--mk);color:var(--mkink)}
.tag.r{background:var(--badsoft);color:var(--bad)}
.q{border-top:1px solid var(--line);padding:18px 0}
.q:first-child{border-top:0;padding-top:0}
.opts{display:grid;gap:8px;margin:10px 0}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--card);min-height:44px}
.opt:hover{border-color:var(--pri)}
.opt input{margin-top:6px;width:18px;height:18px;accent-color:var(--pri)}
.opt.right{border-color:var(--ok);background:var(--oksoft)}
.opt.wrong{border-color:var(--bad)}
.box{border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;background:var(--card)}
.box h3{font-size:16px}
.empty{color:var(--sub);font-size:14px;padding:18px;border:2px dashed var(--line);border-radius:var(--r);text-align:center}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--card);font-size:16px;line-height:1.7;resize:vertical}
input[type=text],input[type=password]{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--card);font-size:16px}
textarea:focus,input:focus{border-color:var(--pri)}
.ai{white-space:pre-wrap;font-size:15px;background:var(--soft);border-radius:10px;padding:14px 16px;margin-top:10px}
.work{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.work>li{border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--card)}
.wt{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.wt input{width:20px;height:20px;margin-top:4px;flex:none;accent-color:var(--ok)}
.wt .why{display:block;font-size:14px;color:var(--sub)}
.hints{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0 32px}
.hints button{font-size:13px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;min-height:36px;color:var(--sub)}
.hints button:hover{border-color:var(--pri);color:var(--pri)}
.hints button[aria-pressed=true]{background:var(--prisoft);border-color:var(--pri);color:var(--pri)}
.hint{margin:8px 0 0 32px;font-size:15px;padding:10px 14px;border-left:4px solid var(--mk);background:light-dark(#fffbea,#2a2510);border-radius:0 10px 10px 0;white-space:pre-wrap}
.hint code,.code{font-family:ui-monospace,Consolas,monospace;font-size:14px;overflow-wrap:anywhere}
.field{margin:0 0 20px}
.field label{display:block;font-weight:700;margin-bottom:6px}
.field textarea{min-height:120px;font-family:ui-monospace,Consolas,"BIZ UDPGothic",monospace;font-size:14px}
.field .hd{font-size:13px;color:var(--sub);margin-bottom:6px}
.res{font-size:14px;margin-top:6px}
.done-banner{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--ok);color:#fff;border-radius:var(--r);padding:16px 20px;margin-bottom:20px}
:root[data-theme=dark] .done-banner{color:#0e131c}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .done-banner{color:#0e131c}}
.done-banner b{font-family:var(--hfont);font-size:20px}
.done-banner .btn{margin-left:auto;background:#fff;color:var(--ok);border-color:#fff}
.navb{display:flex;justify-content:space-between;gap:10px;margin-top:28px;border-top:1px solid var(--line);padding-top:18px;max-width:none!important}

/* method */
.pagehead{padding:clamp(28px,4vw,48px) 0 6px}
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:18px 0 8px}
.fs{position:relative;padding:20px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);border-top:5px solid var(--pri)}
.fs:nth-child(2){border-top-color:var(--ok)}.fs:nth-child(3){border-top-color:var(--s4)}
.fs .k{font-family:var(--hfont);font-size:22px;font-weight:900;display:flex;align-items:center;gap:10px;color:var(--ink)}
.fs .k::before{counter-increment:fs;content:counter(fs);width:30px;height:30px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:15px}
.flow{counter-reset:fs}
.fs:nth-child(2) .k::before{background:var(--ok)}.fs:nth-child(3) .k::before{background:var(--s4)}
.fs h3{font-size:15px;color:var(--sub);font-weight:400;font-family:inherit;margin:8px 0}
.fs ul{margin:10px 0 0;padding-left:1.2em;font-size:15px}
.fs li{margin-bottom:4px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:15px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-size:13px;color:var(--sub);font-weight:700;background:var(--soft)}
td.r,th.r{text-align:right}
.mini{font-size:13px;width:auto;border-radius:8px}
.mini td,.mini th{padding:6px 10px;border-right:1px solid var(--line)}
.mini .y{background:var(--mk);color:var(--mkink)}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
/* data */
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:14px 0 22px}
.chain .t{border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:700;background:var(--card);box-shadow:var(--shadow)}
.chain .t small{display:block;font-weight:400;font-size:12px;color:var(--sub)}
.chain .a{font-size:12px;color:var(--pri);display:flex;flex-direction:column;align-items:center;font-weight:700}
.chain .a::after{content:"→";font-size:20px;line-height:1}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.tcard{border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;background:var(--card);box-shadow:var(--shadow)}
.tcard .bk{font-size:12px;color:var(--sub)}
.tcard h3{display:flex;justify-content:space-between;gap:8px}
.tcard .cols{font-size:13px;color:var(--sub);margin:6px 0}
.tcard ul{margin:6px 0 0;padding-left:1.1em;font-size:14px}
.warn{color:var(--bad)}
/* tools */
.filt{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 16px}
.filt button{min-height:40px;padding:6px 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.filt button[aria-pressed=true]{background:var(--pri);color:#fff;border-color:var(--pri)}
.tl{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.tl .tcard .bk{display:inline-block;font-weight:700;border-radius:99px;padding:0 10px;background:var(--soft)}
.tl .tcard dl{margin:8px 0 0;font-size:14px;display:grid;grid-template-columns:4.5em 1fr;gap:4px 10px}
.tl dt{color:var(--sub)}.tl dd{margin:0}
.chk{list-style:none;display:grid;gap:6px;columns:2;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px}
.chk label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;min-height:36px}
.chk input{width:18px;height:18px;margin-top:5px;accent-color:var(--ok)}
/* teacher */
.scroll{overflow-x:auto}
.prog td,.prog th{white-space:nowrap;font-size:14px}
.prog td.c{text-align:center}
.cellok{display:inline-block;min-width:28px;padding:1px 7px;border-radius:99px;background:var(--oksoft);color:var(--ok);font-weight:700;font-size:12px}
.cellp{color:var(--sub);font-size:12px}
details{border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin-bottom:10px;background:var(--card)}
summary{cursor:pointer;font-weight:700;min-height:28px}
summary:hover{color:var(--pri)}
.dlg{position:fixed;inset:0;background:rgba(14,19,28,.5);display:grid;place-items:center;z-index:20;padding:16px}
.dlg>div{background:var(--card);border-radius:var(--r);padding:22px;max-width:480px;width:100%}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 18px;border-radius:10px;font-size:14px;z-index:30}
@media(max-width:900px){.stagerow{grid-template-columns:minmax(0,1fr)}.hero{grid-template-columns:minmax(0,1fr)}}
@media(max-width:760px){.cols2,.flow{grid-template-columns:minmax(0,1fr)}.chk{columns:1}.infos{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.sync{display:none}nav.tabs{flex-basis:100%;order:3;margin:0 -6px}.topin{gap:4px 12px}
 .reqt{font-size:16px}.steps button{font-size:12px}.steps button .c{width:34px;height:34px}.steps button:not(:last-child)::after{top:17px;left:calc(50% + 21px);right:calc(-50% + 21px)}
 .stagerow{padding:14px}.tks{grid-template-columns:minmax(0,1fr)}
 table{font-size:13px}.stack{border:0;background:none}.stack thead{display:none}.stack tr{display:grid;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;color:var(--sub);font-size:12px}.stack td:empty{display:none}}

ー"],"req":"[[請求金額|対象の列。「支払金額」と取り違えやすい]]が[[90万円以上|900,000ちょうどを含む]]の請求が[[何件あるか|出力は件数（1つの数字）]]教えてください。\n来月以降もデータが更新されたら同じ表で数えたいので、[[数え直さなくても自動で反映されるようにしておいてほしい|手入力の数字ではなく、数式で数えておく]]です。","steps":[{"t":"請求一覧で「請求金額」の列を確認する（支払金額と取り違えない）","r":1,"w":"似た名前の列は事故のもと。見出しを声に出して確認。","h":["依頼に出てくる言葉と、列見出しを1つずつ照らし合わせましょう。","請求金額はF列、支払金額はG列です。","—"]},{"t":"空いているセルに基準額 900000 を入力し、隣に「基準額」とラベルを付ける","r":2,"w":"変わる可能性のある値は数式に埋め込まず、セルに出しておく。","h":["来月「80万以上で」と言われたら、どこを直せば済むようにしたいですか？","例：L1に「基準額」、M1に 900000","—"]},{"t":"COUNTIFで、請求金額の列から基準額以上のセルを数える","r":3,"w":"COUNTIF(範囲, 条件)。条件に比較演算子を使うときは文字列で書き、セルとは & でつなぐ。","h":["「何を」「どんな条件で」数えるかを分けて考えます。","条件は \">=900000\" のように文字列。セル参照と組み合わせるなら \">=\"&M1。","=COUNTIF(請求一覧!F:F,\">=\"&M1)"]},{"t":"フィルターの数値フィルター「指定の値以上」で同じ件数になるか検算する","r":4,"w":"関数とフィルターという別ルートで同じ数字が出れば安心して報告できる。","h":["左下のステータスバーに「15000 レコード中 ○ 個が見つかりました」と出ます。","データタブ → フィルター → 請求金額の▼ → 数値フィルター → 指定の値以上。","検算が終わったらフィルターをクリア。"]}],"decoys":[{"t":"statusを「支払い済」に絞ってから数える","w":"依頼にステータスの条件はない。書かれていない条件を勝手に足さない。"},{"t":"フィルター結果の件数をセルに手入力する","w":"データが更新されると古い数字のまま残る。依頼の「自動で反映」を満たさない。"}],"checks":[{"t":"フィルターで数えた件数とCOUNTIFの結果が一致した","w":"2つの方法の一致が最強の検算。"},{"t":"基準額のセルを一時的に変えると、結果が変わることを確かめた","w":"「自動で反映」の要件を自分で試す。確かめたら900000に戻す。"},{"t":"全体（15,000件）に対して多すぎも少なすぎもしない数か考えた","w":"およそ1割。桁が違えば条件の向き（以上/未満）を疑う。"}],"report":{"to":"佐藤さん","pts":["件数を最初に書いた","全体に対する割合など、数字の大きさが分かる情報を添えた","基準額セルの場所・使い方を伝えた"]}},{"id":"m03","stage":1,"stars":1,"mins":15,"old":"実践課題 問題3","title":"支払い済みの割合","from":{"n":"山本","d":"経営企画部"},"files":["請求データ.xlsx ›「請求一覧」"],"tools":["COUNTIF","COUNT","表示形式"],"req":"会議資料に載せたいので、[[請求全体のうち|分母＝全請求の件数。自分で数える]]、[[ステータスが支払い済になっている請求|分子＝statusが「支払い済」の件数]]の[[割合|件数÷件数。金額ベースではない]]を出してください。\n[[％で、小数第2位まで|表示形式の指定。例：12.34%]]お願いします。","steps":[{"t":"statusの▼を開いて、入っている値の種類と正確な表記を確認する","r":1,"w":"条件に使う値は必ずデータで確かめる。表記ゆれ・余計なスペースの発見にもなる。","h":["データに実際に入っている値を見たことがありますか？","フィルターの▼を押すと、その列の値が一覧で出ます。","値は「支払い済」「滞納」「発行済」の3種類。"]},{"t":"COUNTIFで「支払い済」の件数を数える","r":2,"w":"分子。","h":["条件の文字列は、データからコピーして貼ると表記ゆれを防げます。", 行の契約_id) は、あれば1、なければ0。","K2に =COUNTIF(対象!$A:$A,B2) と入れて下までオートフィル。"]},{"t":"作業列が1の行だけで、請求金額の平均を出す","r":3,"w":"","h":["条件付きの平均はAVERAGEIF。フィルターでもできます。","作業列を1でフィルター → 請求金額列を選択 → ステータスバーの「平均」でも確認できる。","=AVERAGEIF(K:K,1,F:F)"]},{"t":"対象の請求件数と合計も出し、合計÷件数で平均を検算する","r":4,"w":"","h":["—","=COUNTIF(K:K,1)、=SUMIF(K:K,1,F:F)","—"]}],"decoys":[{"t":"契約ごとにAVERAGEIFで平均を出し、それをさらに平均する","w":"平均の平均になり、答えがずれる。"},{"t":"支払金額の列で平均を出す","w":"依頼は請求金額。"}],"checks":[{"t":"合計÷件数がAVERAGEIFの結果と一致した","w":""},{"t":"作業列の1の行をフィルターし、契約_idがすべて500以下になっている","w":"結果側から条件を逆チェック。"},{"t":"平均が請求金額の最小〜最大の範囲に収まり、全体平均と比べても不自然でない","w":"桁ずれ・列の取り違えの発見。"}],"report":{"to":"山本さん","pts":["平均額を最初に書いた","対象の件数（契約数・請求数）を添えた","「2022年以前」の解釈を書いた"]}},{"id":"m08","stage":3,"stars":3,"mins":35,"old":"実践課題 課題7","title":"契約切れ法人の残りユーザ数","from":{"n":"鈴木","d":"カスタマーサクセス部"},"files":["一覧データ.xlsx ›「顧客一覧」「ユーザ一覧」"],"tools":["フィルター","COUNTIFS"],"req":"[[is_activeがFALSE|顧客一覧のis_active列]]の法人のうち、[[契約終了日がもう過ぎている|基準日2025/7/1以前]][[東京都|請求先住所_1が「東京都」]]の法人を教えてください。\nそれぞれ、[[いまActiveなユーザが何人残っているか|ユーザ一覧で、その顧客_idかつ状態＝Activeの人数]]も知りたいです。","steps":[{"t":"顧客一覧のコピーで、is_active＝FALSE、請求先住所_1＝東京都、契約終了日≦2025/7/1 をフィルターする","r":1,"w":"","h":["3つの条件を列ごとに。","is_activeはM列、請求先住所_1はH列、契約終了日はE列。","契約終了日 → 日付フィルター → 2025/7/1 以前"]},{"t":"顧客_id・顧客名・契約終了日を作業シートに貼る","r":2,"w":"","h":["—","—","—"]},{"t":"ユーザ数の列を追加し、COUNTIFSで顧客_idが一致し状態がActiveのユーザを数える","r":3,"w":"","h":["「この法人の」かつ「Activeな」ユーザ。","ユーザ一覧は B:顧客_id、I:状態。","=COUNTIFS(ユーザ一覧!$B:$B,$A2,ユーザ一覧!$I:$I,\"Active\")"]},{"t":"1社だけ、ユーザ一覧をフィルターして人数を数え、COUNTIFSの結果と照合する","r":4,"w":"","h":["—","顧客_idと状態でフィルター → ステータスバーの件数。","—"]}],"decoys":[{"t":"COUNTIF(ユーザ一覧!B:B, 顧客_id) で数える","w":"状態の条件が抜け、退会・停止中のユーザも数えてしまう。"}],"checks":[{"t":"1社分をフィルターで数えた人数が、COUNTIFSの結果と一致した","w":""},{"t":"基準日（2025/7/1）を報告に書く準備ができている","w":""}],"report":{"to":"鈴木さん","pts":["対象社数を最初に書いた","基準日を書いた","人数の多い法人など、目立つ点に触れた"]}},{"id":"m09","stage":3,"stars":3,"mins":40,"old":"実践課題 課題8","title":"更新案内メールの送付リスト","from":{"n":"鈴木","d":"カスタマーサクセス部"},"files":["一覧データ.xlsx ›「契 /* ===== 採点エンジン（正解は持たず、ハッシュで照合） ===== */
const G=(()=>{
 const nf=s=>String(s??'').normalize('NFKC');
 const ns=s=>nf(s).replace(/\s+/g,'');
 const pad=n=>String(n).padStart(2,'0');
 function num(s){const t=nf(s).replace(/[,\s円¥件社人%％]/g,'');if(t===''||!/^-?\d*\.?\d+$/.test(t))return null;return parseFloat(t)}
 function date(s){const t=nf(s).trim();let m=t.match(/^(\d{4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/);
  if(m)return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  const n=num(t);if(n!=null&&n>20000&&n<80000){const d=new Date(Date.UTC(1899,11,30)+Math.floor(n)*864e5);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
  return t}
 function cell(v,t){if(t==='n'){const n=num(v);return n==null?ns(v):String(Math.round(n*100)/100)}if(t==='d')return date(v);if(t==='e')return ns(v).toLowerCase();return ns(v)}
 function rows(text){
  return nf(text).replace(/\r/g,'').split('\n').map(l=>{
   if(l.includes('\t'))return l.split('\t').map(x=>x.trim());
   if(/,(?!\d{3}(\D|$))/.test(l))return l.split(',').map(x=>x.trim());
   return l.trim().split(/\s{2,}/).map(x=>x.trim());
  }).filter(r=>r.some(x=>x!==''));
 }
 function decimals(raw){const m=nf(raw).replace(/[,%％\s]/g,'').match(/\.(\d+)$/);return m?m[1].length:0}
 const canNum=v=>String(Math.round(v));
 const canTxt=raw=>ns(raw).replace(/(業界|業種)$/,'');
 const canTable=(R,C,ordered)=>{const rs=R.map(r=>C.map((c,i)=>cell(r[i],c.t)));if(!ordered)rs.sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0);return rs.map(r=>r.join('|')).join('\n')};

 /* --- 暗号まわり（WebCrypto） --- */
 const te=new TextEncoder(),td=new TextDecoder();let SALT='',IT=5000;const cache=new Map();
 const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
 const b64e=u=>{let s='';new Uint8Array(u).forEach(x=>s+=String.fromCharCode(x));return btoa(s)};
 const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
 function setSalt(s,it){SALT=s;IT=it||5000;cache.clear()}
 async function H(s){if(cache.has(s))return cache.get(s);const k=await crypto.subtle.importKey('raw',te.encode(s),'PBKDF2',false,['deriveBits']);
  const h=hex(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:te.encode(SALT),iterations:IT},k,128));cache.set(s,h);return h}
 async function aes(pass,salt,it){const k=await crypto.subtle.importKey('raw',te.encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt:te.encode(salt),iterations:it},k,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
 async function seal(obj,pass,salt,it){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await aes(pass,salt,it),te.encode(JSON.stringify(obj)));return{iv:b64e(iv),ct:b64e(ct)}}
 async function unseal(b,pass,salt,it){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(b.iv)},await aes(pass,salt,it),b64d(b.ct));return JSON.parse(td.decode(pt))}

 /* --- 採点 --- */
 const OK=(canon,msg)=>({ok:true,msg:msg||'正解です。',canon});
 async function gNum(f,fid,raw){const v=num(raw);if(v==null)return{ok:false,msg:'数値として読み取れませんでした。数字だけを入力してください（例：1234）。'};
  const c=canNum(v);const h=await H(fid+'|n|'+c);if(h===f.h)return OK(c);
  const d=f.diags[h];if(d)return{ok:false,code:d.c,msg:d.m};
  return{ok:false,msg:'値が違います。条件・使った列・範囲を、依頼文と1つずつ照らし合わせてみましょう。'}}
 async function gPct(f,fid,raw){const t=nf(raw);const r0=num(t);if(r0==null)return{ok:false,msg:'数値として読み取れませんでした。例：12.34%'};
  let v=r0,dg=decimals(t);if(!/[%％]/.test(t)&&v<=1.5){v=v*100;dg=Math.max(0,dg-2)}
  const c=v.toFixed(2);
  if(await H(fid+'|p|'+c)===f.h){if(dg===f.digits)return OK(c);return{ok:false,code:'digits',msg:'値は合っています。依頼どおり「小数第'+f.digits+'位まで」の表示にしましょう（例：12.34%）。'}}
  for(const x of [c,r0.toFixed(2)]){const d=f.diags[await H(fid+'|p|'+x)];if(d)return{ok:false,code:d.c,msg:d.m}}

  return OK(canTable(R,C,f.ordered),'正解です。'+R.length+'行すべて一致しました。')}

function pSubmit(M,s){const F=PUB.fields[M.id];

async function coach(id,k){const M=MI[id],s=ms(id);const box=document.getElementById('ai-'+k);if(!SAMPLE||!box)return;
 const text=k==='plan'?s.pt:s.rep;if(!text||text.trim().length<10){box.innerHTML='<div class="fb info">もう少し書いてから見てもらいましょう。</div>';return}

 const ctx='# 依頼（'+M.from.d+' '+M.from.n+'さん）\n'+plainReq(M.req)+'\n\n# 依頼の要点\n'+segs(M.req).filter(x=>x.k).map(x=>'- '+x.t+'：'+x.w).join('\n');
 const body=k==='plan'?'\n\n# 講師が想定する手順（受講者には見せない）\n'+M.steps.map((x,i)=>(i+1)+'. '+x.t).join('\n')+'\n\n# 受講者が書いた手順\n'+text+'\n\n# 出力\n日本語で250〜400字。次の3つの見出しをこの順で使う：「よい点」「見直したい点」「考えてみよう」。見直したい点は最大2つ。想定手順を丸写しせず、抜けや順番の問題を問いかけの形で示す。記号による装飾（#や*）は使わない。'
  :'\n\n# 報告のチェックポイント\n'+['結論が最初の一文にある','数字に単位と分母がある','条件・解釈・前提が書かれている','簡潔で、依頼者がそのまま使える'].concat(M.report.pts).join('\n')+(s.sec?'\n\n# 参考：講師の模範例（受講者には見せない。数値の正誤はここで判定しない）\n'+s.sec.model:'')+'\n\n# 受講者の報告文\n'+text+'\n\n# 出力\n日本語で200〜350字。見出しは「よい点」「直すともっと伝わる点」「書き直しの一言例」。書き直し例は受講者の文を1文だけ改善したもの。模範例の文面を写さない。記号による装飾（#や*）は使わない。';
 box.innerHTML='<div class="ai" aria-live="polite">考えています…</div>';const out=box.firstChild;
 try{const r=await SAMPLE([{role:'user',content:sys+'\n\n'+ctx+body}],{onText:({text})=>{out.textContent=text},cache:false});out.textContent=r.text}

 const docs=TDOCS||[];
 const diagMsg=DIAGS;
 const agg={};docs.forEach(d=>{const m=d.s?.m||{};for(const [id,x] of Object.entries(m))for(const [c,n] of Object.entries(x.diag||{})){const k=id+':'+c;agg[k]=(agg[k]||0)+n}});
 const aggL=Object.entries(agg).sort((a,b)=>b[1]-a[1]).slice(0,12);
 const name=id=>TNAMES[id]||'受講者 '+id.slice(-4);
 app.innerHTML=`<section class="band"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap"><h1>講師画面</h1><button class="btn g" data-a="tlogout">この端末で講師画面を閉じる</button></div>
 <p class="small sub">この端末はパスコードを記憶しています。受講者と共用する端末では、使い終わったら上のボタンで閉じてください。</p>
 <h2>受講状況</h2>
 ${!DB?(CFG.sheetUrl?`<div class="fb info"><b>受講者の進捗はGoogleスプレッドシートに集まっています</b>受講者がホーム画面で名前を入力すると、ミッションごとに1行ずつ（状態・判定回数・ヒント数・つまずき・手順メモ・報告文）が記録・更新されます。</div>`:`<div class="fb info"><b>進捗の自動集約は未設定です</b>受講者にホーム画面の「進捗をテキストでコピー」で送ってもらってください。無料で自動集約したい場合は、READMEの手順でGoogleスプレッドシート連携を設定し、index.html冒頭の sheetUrl にURLを入れてください。</div>`):
  !docs.length?`<div class="fb info">まだ受講者の記録はありません。受講者がミッションを始めると、ここに表示されます。共有時は受講者を「投稿者（Contributor）」以上にしてください。</div>`:
  `<div class="scroll"><table class="prog"><thead><tr><th>受講者</th><th class="r">解決</th>${MISSIONS.map(m=>`<th class="c">${m.id.toUpperCase()}</th>`).join('')}<th>最終更新</th></tr></thead><tbody>${docs.map(d=>{const m=d.s?.m||{};const n=MISSIONS.filter(x=>m[x.id]?.ok).length;
   return`<tr><td>${esc(name(d.id))}</td><td class="r num">${n}</td>${MISSIONS.map(x=>{const v=m[x.id];return`<td class="c">${!v?'<span class="cellp">–</span>':v.ok?`<span class="cellok" title="判定${v.att}回・ヒント${Object.keys(v.hints||{}).length}">${v.att}/${Object.keys(v.hints||{}).length}</span>`:v.gu?'<span class="cellp">解説</span>':`<span class="cellp">${esc(stepsOf(x.id)[v.step]||'')}</span>`}</td>`}).join('')}<td class="small">${d.u?new Date(d.u).toLocaleString('ja-JP'):''}</td></tr>`}).join('')}</tbody></table></div>
  <p class="small sub">黄色のセル＝解決（判定回数／ヒント数）。灰色＝進行中のステップ。</p>`}
 ${aggL.length?`<h2 style="margin-top:24px">よくあるつまずき（全受講者）</h2><table class="stack"><thead><tr><th>課題</th><th class="r">回数</th><th>内容</th></tr></thead><tbody>${aggL.map(([k,n])=>`<tr><td>${esc(k.split(':')[0].toUpperCase())}</td><td class="r num">${n}</td><td>${esc(diagMsg[k]||k)}</td></tr>`).join('')}</tbody></table>`:''}
 ${docs.length?`<h2 style="margin-top:24px">受講者の手順メモと報告文</h2>${docs.map(d=>{const m=d.s?.m||{};const rows=MISSIONS.filter(x=>m[x.id]&&(m[x.id].rep||m[x.id].pt));return rows.length?`<details><summary>${esc(name(d.id))}（${rows.length}件）</summary>${rows.map(x=>`<div style="margin-top:10px"><strong>${x.id.toUpperCase()} ${esc(x.title)}</strong>${m[x.id].pt?`<div class="small sub">手順メモ</div><div class="ai" style="margin-top:2px">${esc(m[x.id].pt)}</div>`:''}${m[x.id].rep?`<div class="small sub">報告文</div><div class="ai" style="margin-top:2px">${esc(m[x.id].rep)}</div>`:''}</div>`).join('')}</details>`:''}).join('')}`:''}
 </section>
 <section class="band" style="padding-top:0"><h2>ミッション別 指導メモと正解</h2>
 ${MISSIONS.map(M=>{const A=T.m[M.id];return`<details><summary>${M.id.toUpperCase()} ${esc(M.title)}　<span class="sub small" style="font-weight:400">${esc(A.old)}</span></summary>
  <p style="margin-top:10px"><strong>正解：</strong>${esc(A.summary)}</p>
  ${A.fields.map(f=>f.k==='table'?`<div class="scroll"><table class="mini"><thead><tr>${f.cols.map(c=>`<th>${esc(c.h)}</th>`).join('')}</tr></thead><tbody>${f.rows.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:`<div class="small">${esc(f.label)}：<strong>${esc(f.k==='text'?f.accept.join('／'):f.k==='pct'?f.v.toFixed(2)+'%':Number(f.v).toLocaleString())}</strong></div>`).join('')}
  ${A.table?`<div class="scroll" style="margin-top:8px"><table class="mini"><thead><tr><th>業界</th><th>請求件数</th><th>滞納件数</th><th>滞納率</th></tr></thead><tbody>${A.table.map(r=>`<tr><td>${esc(r[0])}</td><td class="r">${r[1].toLocaleString()}</td><td class="r">${r[2]}</td><td class="r">${r[3].toFixed(2)}%</td></tr>`).join('')}</tbody></table></div>`:''}
  <p style="margin-top:10px"><strong>狙い：</strong>${esc(A.teach.aim)}</p>
  <p><strong>よくあるつまずき：</strong>${A.teach.stumble.map(esc).join('／')}</p>
  <p><strong>問いかけ例：</strong>${A.teach.ask.map(esc).join('／')}</p></details>`}).join('')}</section>
 <section class="band" style="padding-top:0"><h2>現行教材から見つかった改善点</h2><table class="stack"><thead><tr><th>項目</th><th>内容</th><th>このアプリでの対応</th></tr></thead><tbody>${T.fixes.map(f=>`<tr><td><strong>${esc(f[0])}</strong></td><td>${esc(f[1])}</td><td>${esc(f[2])}</td></tr>`).join('')}</tbody></table></section>`;
 resolveNames()}
async function resolveNames(){if(!U||!TDOCS)return;const ids=TDOCS.map(d=>d.id).filter(i=>!TNAMES[i]);if(!ids.length)return;
 try{const ps=await U.profiles(ids);let ch=false;ids.forEach(i=>{const n=ps?.[i]?.name;if(n){TNAMES[i]=n;ch=true}});if(ch&&location.hash==='#teacher')teacher()}catch(e){}}
function subTeacher(){if(!DB||tUnsub||!canTeach)return;
 try{tUnsub=DB.collection('progress').onSnapshot(sn=>{TDOCS=sn.docs.map(d=>({id:d.id,...(d.data()||{})})).sort((a,b)=>(b.u||0)-(a.u||0));if(location.hash==='#teacher')teacher()},e=>{tUnsub=null})}catch(e){}}

let judging=false;
async function judge(id){if(judging)return;judging=true;const s=ms(id),F=PUB.fields[id];const btn=document.getElementById('judge');if(btn){btn.disabled=true;btn.textContent='判定中…'}
 try{let all=true;const canon=[];let th='';s.att++;
  for(const [i,f] of F.entries()){const v=document.getElementById('f'+i)?.value??'';s.inp[i]=v;const r=await G.grade(f,id+':'+i,v);s.res[i]={ok:r.ok,msg:r.msg};
   if(r.ok){canon.push(r.canon);if(r.h)th=r.h}else{all=false;const c=r.code||'other';s.diag[c]=(s.diag[c]||0)+1}}
  if(all){try{const sb=PUB.sec[id];s.sec=await G.unseal(sb.iv?sb:sb[th],canon.join('␞'),PUB.salt+'|sec|'+id,PUB.itSec)}catch(e){}if(!s.ok){s.ok=true;s.t1=Date.now()}}
 }finally{judging=false}
 if(cur()===id)rerender(1);else save()}
async function unlockTeacher(pass,manual){if(!pass)return;const m=document.getElementById('pcm');if(m)m.textContent='確認中…';
 try{T=await G.unseal(PUB.teacher,pass,PUB.salt+'|teacher',PUB.itT);try{localStorage.setItem(TKEY,pass)}catch(e){}
  document.getElementById('tlink').hidden=false;if(location.hash==='#teacher')teacher()}
 catch(e){T=null;if(manual&&m)m.textContent='パスコードが違います。'}}

/* ---------- ルーター ---------- */
function route(){const h=location.hash.slice(1)||'home';nav(h);
 if(MI[h])mission(h);else if(h==='method')method();else if(h==='data')datamap();else if(h==='tools')tools();else if(h==='teacher')teacher();else home();
 window.scrollTo(0,0)}
const cur=()=>{const h=location.hash.slice(1);return MI[h]?h:null};
function rerender(keepScroll){const y=window.scrollY;panel(cur());save();sendSheet(cur());if(keepScroll)window.scrollTo(0,y)}

app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;const id=cur();const s=id&&ms(id);const M=id&&MI[id];
 if(a==='step'){const i=+b.dataset.i;if(i<0||i>2)return;if(s.step===0&&i>0)s.rd=true;s.step=i;rerender();const top=document.querySelector('.steps').getBoundingClientRect().top+window.scrollY-70;if(window.scrollY>top)window.scrollTo(0,top);return}
 if(a==='mk'){if(s.mkc)return;const i=+b.dataset.i;s.mk=s.mk.includes(i)?s.mk.filter(x=>x!==i):s.mk.concat(i);rerender(1);return}
 if(a==='mkcheck'){s.mkc=true;rerender(1);return}
 if(a==='mkreset'){s.mkc=false;s.mk=[];rerender(1);return}
 if(a==='memocheck'){if(M.clarify.some((q,i)=>!(s.memo[i]||[]).length)){toast('すべての問いに答えてから答え合わせしましょう');return}s.memoc=true;rerender(1);return}
 if(a==='memoreset'){s.memoc=false;rerender(1);return}
 if(a==='padd'){s.plan.push(b.dataset.k);rerender(1);return}
 if(a==='pup'||a==='pdn'||a==='pdel'){const i=+b.dataset.i;if(a==='pdel')s.plan.splice(i,1);else{const j=a==='pup'?i-1:i+1;if(j<0||j>=s.plan.length)return;[s.plan[i],s.plan[j]]=[s.plan[j],s.plan[i]]}rerender(1);return}
 if(a==='pcheck'){s.planc=true;rerender(1);return}
 if(a==='preset'){s.planc=false;s.plan=[];rerender(1);return}
 if(a==='rev'||a==='revall'){const n=M.steps.length;s.rev=a==='rev'?Math.min(n,(s.rev||0)+1):n;rerender(1);return}
 if(a==='hint'){s.hints[b.dataset.i+'-'+b.dataset.j]=true;rerender(1);return}
 if(a==='judge'){judge(id);return}
 if(a==='model'){if(s.sec){s.repShown=true;rerender(1)}return}
 if(a==='ai'){coach(id,b.dataset.k);return}
 if(a==='copyprog'){copy(progText());return}
 if(a==='tf'){tFilter=b.dataset.g;tools();return}
 if(a==='tlogout'){T=null;try{localStorage.removeItem(TKEY)}catch(e){}document.getElementById('tlink').hidden=true;location.hash='#home';return}
 if(a==='pass'){unlockTeacher(document.getElementById('pc').value.trim(),true);return}
});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pc'){unlockTeacher(e.target.value.trim(),true);return}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button]')){e.preventDefault();e.target.click()}});
app.addEventListener('change',e=>{const t=e.target;const a=t.dataset.a;const id=cur();
 if(a==='memo'){const s=ms(id),q=+t.dataset.q,o=+t.dataset.o;const multi=MI[id].clarify[q].m;let sel=s.memo[q]||[];sel=multi?(t.checked?sel.concat(o):sel.filter(x=>x!==o)):[o];s.memo[q]=sel;save();return}
 if(a==='work'||a==='ver'){const s=ms(id);const k=a;if(t.checked)s[k][t.dataset.i]=true;else delete s[k][t.dataset.i];save();refreshSteps(id);return}
 if(a==='basic'){if(t.checked)S.basics[t.dataset.i]=true;else delete S.basics[t.dataset.i];save()}
});
app.addEventListener('input',e=>{if(e.target.dataset.a==='name'){S.name=e.target.value.trim();save();sheetLabel();return}});
app.addEventListener('input',e=>{const t=e.target;const a=t.dataset.a;const id=cur();if(!id)return;const s=ms(id);
 if(a==='pt'){s.pt=t.value;save()}else if(a==='rep'){s.rep=t.value;save();sendSheet(id)}else if(a==='inp'){s.inp[t.dataset.i]=t.value;save()}});
addEventListener('hashchange',route);
route();sheetLabel();
try{const p=localStorage.getItem(TKEY);if(p)unlockTeacher(p,false)}catch(e){}

/* ---------- Claude連携（あれば有効化） ---------- */
(async()=>{const use=window.claude&&window.claude.use;if(!use)return;
 try{[U,DB,SAMPLE]=await Promise.all([use('user'),use('db'),use('sample')])}catch(e){}
 if(SAMPLE&&cur()&&[0,2].includes(ms(cur()).step))panel(cur());
 if(U){try{canTeach=!!(await U.canEdit())||!!(await U.isOwner())}catch(e){}}
 if(DB&&U){try{UID=await U.id()}catch(e){}}
 if(DB&&UID){setSync('クラウドと同期中…');const to=setTimeout(()=>setSync('この端末に保存（クラウドに接続できません）'),10000);
  try{const sn=await DB.doc('progress/'+UID).get();clearTimeout(to);const d=sn.exists?sn.data():null;
   if(d&&d.s&&(d.u||0)>(S.u||0)){S=d.s;if(!S.basics)S.basics={};try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){};route()}
   remote='cloud';setSync('クラウドに保存');if((S.u||0)>((d&&d.u)||0)&&Object.keys(S.m).length){dirty=true;push()}}
  catch(e){clearTimeout(to);setSync('この端末に保存')}}
 if(canTeach){subTeacher();if(location.hash==='#teacher')teacher()}
})();
}

</script>
</body>
